// ============ TIMELINE DRAG ============
let dragState=null;
function startDrag(e,eventId){
  if(e.button!==0)return;
  const story=app.currentStory;if(!story)return;
  const svg=e.target.closest('svg');
  if(!svg)return;
  const rect=svg.getBoundingClientRect();
  const pt={x:e.clientX-rect.left,y:e.clientY-rect.top};
  dragState={eventId,startX:pt.x,startY:pt.y,origX:0,origY:0,svg,rect};
  for(const t of story.timeline.tracks){
    const ev=t.events.find(e=>e.id===eventId);
    if(ev){dragState.origX=ev._x||0;dragState.origY=ev._y||0;dragState.trackId=t.id;break}
  }
  document.addEventListener('mousemove',onDrag);
  document.addEventListener('mouseup',endDrag);
  e.preventDefault();
}
function onDrag(e){
  if(!dragState)return;
  const rect=dragState.svg.getBoundingClientRect();
  dragState.rect=rect;
  const pt={x:e.clientX-rect.left,y:e.clientY-rect.top};
  const dx=pt.x-dragState.startX;
  const dy=pt.y-dragState.startY;
  const g=dragState.svg.querySelector(`g[data-eid="${dragState.eventId}"]`);
  if(g)g.setAttribute('transform',`translate(${dx},${dy})`);
  e.preventDefault();
}
function endDrag(e){
  if(!dragState)return;
  document.removeEventListener('mousemove',onDrag);
  document.removeEventListener('mouseup',endDrag);
  const story=app.currentStory;if(!story){dragState=null;return}
  const rect=dragState.rect||dragState.svg.getBoundingClientRect();
  const pt={x:e.clientX-rect.left,y:e.clientY-rect.top};

  const tracks=story.timeline.tracks;
  const trackH=120;const marginTop=20;
  let newTrackIdx=Math.round((pt.y-marginTop-40)/trackH);
  if(newTrackIdx<0)newTrackIdx=0;if(newTrackIdx>=tracks.length)newTrackIdx=tracks.length-1;

  const eventId=dragState.eventId;
  let srcTrack=null,srcIdx=-1,evData=null;
  for(const t of tracks){
    const idx=t.events.findIndex(e=>e.id===eventId);
    if(idx!==-1){srcTrack=t;srcIdx=idx;evData=t.events[idx];break}
  }
  if(evData&&srcTrack){
    srcTrack.events.splice(srcIdx,1);
    const newX=Math.max(60,pt.x-dragState.startX+dragState.origX);
    evData.trackId=tracks[newTrackIdx].id;
    evData._x=newX;
    tracks[newTrackIdx].events.push(evData);
    tracks[newTrackIdx].events.sort((a,b)=>(a._x||0)-(b._x||0));
    app.save();
  }
  dragState=null;
  renderTimeline();
}

// ============ TIMELINE ============
function renderTimeline(){
  const story=app.currentStory;if(!story)return;
  const el=document.getElementById('timelineContainer');
  if(!el)return;
  const tracks=story.timeline.tracks;
  if(!tracks||tracks.length===0||tracks.every(t=>t.events.length===0)){
    el.innerHTML='<div class="text-center" style="padding:40px;color:var(--text3)">尚無時間線事件。處理文檔後會自動產生。</div>';
    return;
  }

  const W=el.clientWidth-40||800;
  const H=Math.max(400,tracks.length*160+40);
  const trackH=120;
  const marginTop=20;

  // Sort events by time for x-placement
  let allEvents=[];
  for(const t of tracks){
    for(const e of t.events){allEvents.push({...e,trackColor:t.color})}
  }
  // Assign x positions (preserve dragged positions)
  const gap=Math.max(120,Math.min(200,(W-80)/Math.max(allEvents.length,1)));
  let autoIdx=0;
  for(const t of tracks){
    for(const e of t.events){
      const ae=allEvents.find(a=>a.id===e.id);
      if(!ae)continue;
      ae._y=marginTop+tracks.findIndex(t=>t.id===e.trackId)*trackH+40;
      if(e._x===undefined||e._x===0){
        e._x=60+autoIdx*gap;autoIdx++;
      }
      ae._x=e._x;
    }
  }

  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px" xmlns="http://www.w3.org/2000/svg">`;

  // Draw tracks
  for(let ti=0;ti<tracks.length;ti++){
    const t=tracks[ti];
    const y=marginTop+ti*trackH+60;
    svg+=`<line x1="40" y1="${y}" x2="${W-40}" y2="${y}" stroke="${t.color}" stroke-width="2" opacity="0.3"/>`;
    svg+=`<text x="35" y="${y-15}" fill="${t.color}" font-size="12" text-anchor="end">${t.name}</text>`;
  }

  // Draw lines between events on same track
  for(const t of tracks){
    const evs=t.events.map(e=>allEvents.find(ae=>ae.id===e.id)).filter(Boolean);
    for(let i=1;i<evs.length;i++){
      svg+=`<line x1="${evs[i-1]._x}" y1="${evs[i-1]._y}" x2="${evs[i]._x}" y2="${evs[i]._y}" stroke="${t.color}" stroke-width="1.5" opacity="0.4"/>`;
    }
  }

  // Draw connecting lines for branch2 events (those that intersect main line)
  const branch2=tracks.find(t=>t.id==='branch2');
  if(branch2){
    const main=tracks.find(t=>t.id==='main');
    if(main){
      const mainY=marginTop+tracks.indexOf(main)*trackH+60;
      for(const e of branch2.events){
        const ae=allEvents.find(ae=>ae.id===e.id);
        if(ae){
          svg+=`<line x1="${ae._x}" y1="${ae._y}" x2="${ae._x}" y2="${mainY}" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>`;
          svg+=`<text x="${ae._x+5}" y="${(ae._y+mainY)/2}" fill="#ff6b6b" font-size="10" opacity="0.6">相交</text>`;
        }
      }
    }
  }

  // Draw events
  for(const ae of allEvents){
    const idx=tracks.findIndex(t=>t.id===ae.trackId);
    const y=ae._y;
    const x=ae._x;
    svg+=`<g class="event-node" data-eid="${ae.id}" style="cursor:grab">`;
    svg+=`<circle cx="${x}" cy="${y-5}" r="8" fill="${ae.trackColor}" stroke="#fff" stroke-width="2"
      onmousedown="startDrag(event,'${ae.id}')" onclick="if(!event.defaultPrevented)showEventDetail('${ae.id}')"/>`;
    svg+=`<text x="${x}" y="${y-16}" text-anchor="middle" font-size="10" fill="${ae.trackColor}">${ae.code||''}</text>`;

    // Time label below
    const timeLabel=(ae.time||'').slice(0,20);
    svg+=`<text x="${x}" y="${y+18}" text-anchor="middle" font-size="10" fill="var(--text3)">${timeLabel}</text>`;

    // Event label
    svg+=`<foreignObject x="${x-60}" y="${y+24}" width="120" height="32">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:10px;color:var(--text2);text-align:center;overflow:hidden;text-overflow:ellipsis;line-height:1.3;background:rgba(26,28,36,0.9);padding:2px 4px;border-radius:3px;border:1px solid var(--border)">${escHtml(ae.label||'')}</div>
    </foreignObject>`;
    svg+=`</g>`;
  }

  svg+=`</svg>`;
  el.innerHTML=svg;
}

function showEventDetail(eid){
  const story=app.currentStory;if(!story)return;
  let entry=null,entryIdx=-1;
  for(const t of story.timeline.tracks){
    const e=t.events.find(ev=>ev.id===eid);
    if(e&&e.entryIndex!==undefined){
      const sheet=getSheet(story,'chronicle');
      if(sheet&&sheet.rows[e.entryIndex]){entry=sheet.rows[e.entryIndex];entryIdx=e.entryIndex;break}
    }
  }
  if(!entry)return alert('找不到對應的紀要條目');
  let html='<table class="grid-table">';
  const sheet=getSheet(story,'chronicle');
  if(sheet){
    for(const col of sheet.columns){
      if(col.type==='hidden')continue;
      html+=`<tr><td style="font-weight:600;width:80px;color:var(--accent)">${col.name}</td><td>${escHtml(entry[col.key]||'')}</td></tr>`;
    }
  }
  html+='</table>';
  showModal('條目詳情',html);
}

// ============ RENDER ============
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderAll(){
  const tabBar=document.getElementById('tabBar');
  const main=document.getElementById('mainArea');
  const sel=document.getElementById('storySelect');
  const nameEl=document.getElementById('storyName');
  if(!tabBar||!main)return;

  // Update story selector
  const cur=sel.value;
  sel.innerHTML='<option value="">— 選擇故事 —</option>'+app.stories.map(s=>`<option value="${s.id}"${s.id===app.currentStoryId?' selected':''}>${escHtml(s.name)}</option>`).join('');
  const story=app.currentStory;
  nameEl.textContent=story?story.name+' ('+story.doc.length+' 文檔)':'無故事';
  // Migrate existing stories: upgrade brief_intro from text→textarea
  if(story){
    const charSheet=story.sheets.character||story.sheets.role;
    if(charSheet){
      const col=charSheet.columns?.find(c=>c.key==='brief_intro');
      if(col&&col.type==='text'){col.type='textarea';col.maxLen=500;}
    }
  }

  // Determine visible tabs based on story
  let visibleTabs=[];
  if(story){
    visibleTabs=app.tabOrder.filter(t=>{
      if(t==='errorlog')return true;
      if(t==='character')return !!story.sheets.character;
      if(t==='faction')return !!story.sheets.faction;
      if(t==='item')return !!story.sheets.item;
      if(t==='magic')return !!story.sheets.magic;
      if(t==='technique')return !!story.sheets.technique;
      return true;
    });
  }else{
    visibleTabs=['errorlog'];
  }

  tabBar.innerHTML=visibleTabs.map(t=>`<div class="tab" data-tab="${t}" onclick="switchTab('${t}')">${app.tabLabels[t]||t}</div>`).join('');
  if(visibleTabs.length>0&&!document.querySelector('.tab.active'))switchTab('docs');

  // Render each panel content
  const panelsHtml=visibleTabs.map(t=>`<div class="panel" id="panel_${t}"></div>`).join('');
  main.innerHTML=panelsHtml;
  // Surface storage-pressure warning if a recent save failed
  if(window._storageError){
    main.insertAdjacentHTML('afterbegin',`<div style="background:var(--red);color:#fff;padding:8px 12px;margin-bottom:10px;border-radius:6px;font-size:13px">${escHtml(window._storageError)}</div>`);
  }

  // Fill panel contents
  for(const t of visibleTabs){
    const el=document.getElementById('panel_'+t);
    if(!el)continue;
    if(t==='docs')renderDocsPanel(el,story);
    else if(t==='chronicle')renderChroniclePanel(el,story);
    else if(t==='timeline'){
      const chronicle=getSheet(story,'chronicle');
      const hasEntries=chronicle&&chronicle.rows.length>0;
      const hasEvents=story.timeline.tracks.some(t=>t.events.length>0);
      el.innerHTML=`<div style="margin-bottom:8px;display:flex;gap:8px;align-items:center">
        <button class="btn btn-sm" onclick="processTimelineAI()" ${hasEntries?'':'disabled'}>🔄 AI 處理時間線</button>
        <button class="btn btn-sm btn-outline" onclick="clearTimeline()" ${hasEvents?'':'disabled'}>🗑 清除</button>
        <button class="btn btn-sm btn-outline" onclick="showTimelinePrompt()" ${story.timeline._prompt?'':'disabled'}>📄提示詞</button>
        <span style="font-size:12px;color:var(--text2)">${hasEntries?`紀要表有 ${chronicle.rows.length} 條條目，點擊讓 AI 分析並分配主線/支線`:'尚無紀要，請先處理文檔'}</span>
      </div>
      <div id="timelineContainer" class="timeline-container"></div>`;
      renderTimeline();
    }
    else if(t==='character'||t==='faction'||t==='item'||t==='technique'||t==='magic'){
      const map={character:'character',faction:'faction',item:'item',technique:'technique',magic:'magic'};
      renderSheetPanel(el,story,map[t]);
    }
    else if(t==='foreshadow')renderForeshadowPanel(el,story);
    else if(t==='chat')renderChatPanel(el);
    else if(t==='templates')renderTemplatePanel(el);
    else if(t==='errorlog')renderErrorLogPanel(el);
  }

  // Mark active
  const activeTab=document.querySelector('.tab.active');
  if(activeTab){
    const p=document.getElementById('panel_'+activeTab.dataset.tab);
    if(p)p.classList.add('active');
  }
}

function switchTab(tabId){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const tab=document.querySelector(`.tab[data-tab="${tabId}"]`);
  if(tab)tab.classList.add('active');
  const panel=document.getElementById('panel_'+tabId);
  if(panel){panel.classList.add('active');
    if(tabId==='timeline')renderTimeline();
  }
}

function renderDocsPanel(el,story){
  if(!story){el.innerHTML='<div class="text-center" style="padding:40px;color:var(--text3)">請先建立或選擇一個故事</div>';return}
  let html='<div style="margin-bottom:12px;display:flex;gap:8px;align-items:center">';
  html+=`<button class="btn" onclick="importDocument()">＋匯入文檔</button>`;
  html+=`<button class="btn btn-outline" onclick="processAllBatches()">▶ 處理所有待處理批次</button>`;
  html+=`<button class="btn btn-outline" onclick="reprocessAllDone()">🔄 重新處理所有</button>`;
  html+=`<button class="btn" id="liveStreamToggle" onclick="toggleLivePanel()" title="開啟即時串流視窗，觀看 AI 處理過程">📡 即時串流</button>`;
  const isRunning=story.doc.some(d=>d.batches.some(b=>b.status==='processing'));
  if(isRunning||BatchState.length>0)
    html+=`<button class="btn btn-danger" onclick="stopBatchProcessing()">⏹ 停止處理</button>`;
  if(BatchState.length>0){
    let etaText='';
    const doneDurations=[];
    for(const d of story.doc){
      for(const b of d.batches){
        if(b.duration>0)doneDurations.push(b.duration);
      }
    }
    if(doneDurations.length>0){
      const avg=doneDurations.reduce((s,v)=>s+v,0)/doneDurations.length;
      const etaMs=avg*BatchState.length;
      if(etaMs<86400000)etaText=' · 預計完成 '+formatTime(etaMs);
    }
    html+=`<span style="font-size:13px;color:var(--accent)">佇列 ${BatchState.length} 批待處理${etaText}</span>`;
  }
  html+=`<span style="font-size:13px;color:var(--text2)">Token 上限：${app.settings.tokenLimit}</span>`;
  html+=`</div>`;

  if(story.doc.length===0){
    html+='<div style="padding:30px;text-align:center;color:var(--text3)">尚無文檔。點「匯入文檔」開始。</div>';
    el.innerHTML=html;return;
  }

  for(let di=0;di<story.doc.length;di++){
    const doc=story.doc[di];
    html+=`<div class="doc-item"><span class="name">${escHtml(doc.name)}</span><span class="size">${doc.text.length}字 / ${doc.batches.length}批次</span><button class="btn btn-sm btn-outline" onclick="openFindReplace(${di})" title="搜尋取代此文檔" style="margin-left:8px">🔍</button><button class="btn btn-sm btn-danger" onclick="deleteDocument(${di})" title="刪除此文檔及其產生的紀要條目">🗑</button></div>`;
    html+=`<div class="batch-list" style="margin:4px 0 12px 16px">`;
    for(let bi=0;bi<doc.batches.length;bi++){
      const b=doc.batches[bi];
      // Defensive: a batch with a result is done even if status is stale
      const effectiveStatus=(b.result&&b.status!=='processing')?'done':b.status;
      const statusClass=effectiveStatus==='done'?'status-done':effectiveStatus==='processing'?'status-processing':'status-pending';
      html+=`<div class="batch-card">`;
      html+=`<div class="header"><span class="num">批次 #${bi+1}</span><span class="tokens">${b.tokens} tokens</span></div>`;
      html+=`<div class="preview">${escHtml((b.text||doc.text.slice(b.start||0,b.end||0)||'').slice(0,120))}</div>`;
      html+=`<div style="margin-top:4px;display:flex;gap:6px;align-items:center">`;
      html+=`<span class="status ${statusClass}">${effectiveStatus==='done'?'✅已處理':effectiveStatus==='processing'?('⏳處理中 '+(b._startTime?'('+formatTime(Date.now()-b._startTime)+')':'')):'⏸待處理'}${b.duration?' ('+formatTime(b.duration)+')':''}</span>`;
      if(effectiveStatus!=='processing')html+=`<button class="btn btn-sm" onclick="processBatch(${di},${bi})">${effectiveStatus==='pending'?'處理此批':'🔄重新處理'}</button>`;
      if(effectiveStatus==='pending')html+=`<button class="btn btn-sm btn-outline" onclick="markBatchDone(${di},${bi})" title="不經過 AI，直接將此批標記為已處理">✔標記已處理</button>`;
      if(b.result)html+=`<button class="btn btn-sm btn-outline" onclick="showBatchResult(${di},${bi})">查看結果</button>`;
      if(b._prompt)html+=`<button class="btn btn-sm btn-outline" onclick="showBatchPrompt(${di},${bi})">📄提示詞</button>`;
      if(b._streamLog&&b._streamLog.length>10)html+=`<button class="btn btn-sm btn-outline" onclick="showBatchFullOutput(${di},${bi})">查看 AI 輸出結果</button>`;
      if(b._log&&b._log.length>0)html+=`<button class="btn btn-sm btn-outline" onclick="showBatchLog(${di},${bi})" title="查看此批次的完整處理紀錄（含重試與耗時）">📋紀錄</button>`;
      if(effectiveStatus==='done'&&b.result)html+=`<button class="btn btn-sm btn-danger" onclick="clearBatchResult(${di},${bi})">清除結果</button>`;
      html+=`</div></div>`;
    }
    html+=`</div>`;
  }
  el.innerHTML=html;
  // Live-update elapsed time for any processing batch
  const hasProcessing=story.doc.some(d=>d.batches.some(b=>b.status==='processing'));
  if(hasProcessing){
    clearTimeout(window._docTimer);
    window._docTimer=setTimeout(()=>{
      const panel=document.getElementById('panel_docs');
      if(panel&&panel.classList.contains('active'))renderDocsPanel(el,story);
    },1000);
  }
}

// ── 搜尋取代 ──
let _frDocIdx=-1,_frQuery='',_frMatches=[],_frCur=-1;

function openFindReplace(docIdx){
  const story=app.currentStory;if(!story)return;
  const doc=story.doc[docIdx];if(!doc)return;
  _frDocIdx=docIdx;_frMatches=[];_frCur=-1;_frQuery='';
  const text=doc.text;
  showModal('搜尋與取代',
    `<div style="margin-bottom:8px">
      <textarea id="frText" oninput="frAutoSave()" style="width:100%;height:250px;background:var(--bg2);color:var(--text);border:1px solid var(--border);padding:8px;border-radius:4px;font-size:13px;font-family:inherit;white-space:pre-wrap;resize:vertical">${escHtml(text)}</textarea>
    </div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <input id="frFind" placeholder="搜尋..." style="flex:2;min-width:100px;background:var(--bg2);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:4px" autofocus>
      <input id="frReplace" placeholder="取代為..." style="flex:1;min-width:80px;background:var(--bg2);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:4px">
      <span id="frCount" style="font-size:12px;color:var(--text2);min-width:50px">0</span>
      <button class="btn btn-sm" onclick="frPrev()" id="frPrevBtn" disabled>▲</button>
      <button class="btn btn-sm" onclick="frNext()" id="frNextBtn" disabled>▼</button>
      <button class="btn btn-sm" onclick="frReplace()" id="frReplaceBtn" disabled>取代</button>
      <button class="btn btn-sm btn-outline" onclick="frReplaceAll()" id="frReplaceAllBtn" disabled>全部取代</button>
      <button class="btn btn-sm btn-primary" onclick="frSaveClose()">儲存</button>
    </div>`
  );
  document.getElementById('frFind').addEventListener('input',frSearch);
  document.getElementById('frFind').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();frNext()}});
  document.getElementById('frReplace').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();frReplace()}});
}

function frSearch(){
  const ta=document.getElementById('frText');
  const inp=document.getElementById('frFind');
  if(!ta||!inp)return;
  _frQuery=inp.value;
  if(!_frQuery){_frMatches=[];_frCur=-1;frUpdateUI();return}
  const text=ta.value;
  _frMatches=[];
  let idx=0;
  while(true){
    const pos=text.indexOf(_frQuery,idx);
    if(pos===-1)break;
    _frMatches.push(pos);
    idx=pos+_frQuery.length;
  }
  _frCur=_frMatches.length>0?0:-1;
  frHighlight();
  frUpdateUI();
}

function frHighlight(){
  const ta=document.getElementById('frText');
  if(!ta||!_frQuery){frUpdateUI();return}
  const text=ta.value;
  if(!_frQuery||_frMatches.length===0){frUpdateUI();return}
  // Build highlighted version: split around matches
  let html='';
  let last=0;
  for(let i=0;i<_frMatches.length;i++){
    const pos=_frMatches[i];
    html+=escHtml(text.slice(last,pos));
    html+='<mark class="fr-match'+(i===_frCur?' fr-cur':'')+'">'+escHtml(text.slice(pos,pos+_frQuery.length))+'</mark>';
    last=pos+_frQuery.length;
  }
  html+=escHtml(text.slice(last));
  // Use a mirror div for highlighting
  let mirror=document.getElementById('frMirror');
  if(!mirror){
    mirror=document.createElement('div');
    mirror.id='frMirror';
    mirror.style.cssText='position:absolute;top:0;left:0;right:0;bottom:0;padding:8px;background:var(--bg2);color:var(--text);font-size:13px;font-family:inherit;white-space:pre-wrap;overflow:auto;pointer-events:none;border:1px solid var(--border);border-radius:4px;line-height:1.4;z-index:1';
    ta.parentElement.style.position='relative';
    ta.parentElement.appendChild(mirror);
  }
  // Sync scroll
  mirror.scrollTop=ta.scrollTop;
  mirror.scrollLeft=ta.scrollLeft;
  mirror.innerHTML=html;
  // Make textarea transparent to show highlights
  ta.style.color='transparent';
  ta.style.caretColor='var(--text)';
  frUpdateUI();
}

function frUpdateUI(){
  const cnt=document.getElementById('frCount');
  const prev=document.getElementById('frPrevBtn');
  const next=document.getElementById('frNextBtn');
  const rep=document.getElementById('frReplaceBtn');
  const repAll=document.getElementById('frReplaceAllBtn');
  const has=_frMatches.length>0;
  cnt.textContent=_frMatches.length+(_frCur>=0?' / '+(1+_frCur):'');
  prev.disabled=!has;next.disabled=!has;
  rep.disabled=!_frQuery||_frCur<0;
  repAll.disabled=!_frQuery;
  // Scroll current match into view
  if(_frCur>=0&&_frMatches[_frCur]!==undefined){
    const ta=document.getElementById('frText');
    if(ta){
      const pos=_frMatches[_frCur];
      const lineNum=ta.value.slice(0,pos).split('\n').length;
      const lineH=ta.scrollHeight/ta.value.split('\n').length;
      ta.scrollTop=Math.max(0,(lineNum-3)*lineH);
    }
  }
}

function frPrev(){
  if(_frMatches.length===0)return;
  _frCur=(_frCur-1+_frMatches.length)%_frMatches.length;
  frHighlight();
}

function frNext(){
  if(_frMatches.length===0)return;
  _frCur=(_frCur+1)%_frMatches.length;
  frHighlight();
}

function frReplace(){
  if(_frCur<0||_frCur>=_frMatches.length)return;
  const ta=document.getElementById('frText');
  const rep=document.getElementById('frReplace');
  if(!ta||!rep)return;
  const rv=rep.value;
  const pos=_frMatches[_frCur];
  const before=ta.value.slice(0,pos);
  const after=ta.value.slice(pos+_frQuery.length);
  ta.value=before+rv+after;
  // Recalculate matches
  const lenDiff=rv.length-_frQuery.length;
  _frMatches=_frMatches.map((m,i)=>i>_frCur?m+lenDiff:m);
  _frMatches.splice(_frCur,1);
  if(_frCur>=_frMatches.length&&_frMatches.length>0)_frCur=_frMatches.length-1;
  frHighlight();
  frUpdateUI();
}

function frReplaceAll(){
  const ta=document.getElementById('frText');
  const rep=document.getElementById('frReplace');
  if(!ta||!rep||!_frQuery)return;
  const rv=rep.value;
  ta.value=ta.value.split(_frQuery).join(rv);
  _frMatches=[];_frCur=-1;
  frSearch(); // re-search
}

function defaultSortKey(sheet){
  if(sheet.uid==='sheet_character'||sheet.uid==='sheet_role')return 'name';
  if(sheet.uid==='sheet_magic'||sheet.uid==='sheet_technique')return 'user';
  return null;
}

function hasSheetColumn(sheet,key){
  return sheet&&sheet.columns&&sheet.columns.some(c=>c.key===key);
}

function getSheetSort(sheet){
  if(!sheet._sort||!sheet._sort.key||!hasSheetColumn(sheet,sheet._sort.key)){
    const def=defaultSortKey(sheet);
    if(def&&hasSheetColumn(sheet,def))sheet._sort={key:def,dir:'asc'};
    else return null;
  }
  return sheet._sort||null;
}

function toggleSheetSort(uid,key){
  const story=app.currentStory;if(!story)return;
  const sheet=getSheetByUid(story,uid);
  if(!sheet)return;
  const s=sheet._sort||{};
  if(s.key===key){
    s.dir=s.dir==='asc'?'desc':'asc';
  }else{
    s.key=key;s.dir='asc';
  }
  sheet._sort=s;
  app.save();renderAll();
}

function renderSheet(el,sheet){
  const cols=sheet.columns.filter(c=>c.type!=='hidden');
  const sort=getSheetSort(sheet);
  // Build an array of rows that remembers their original index for editing
  const indexed=sheet.rows.map((r,i)=>({r,i}));
  if(sort&&sort.key){
    indexed.sort((a,b)=>{
      const av=(a.r[sort.key]==null?'':String(a.r[sort.key]));
      const bv=(b.r[sort.key]==null?'':String(b.r[sort.key]));
      let cmp=av.localeCompare(bv,'zh-Hant-CN');
      if(sort.dir==='desc')cmp=-cmp;
      return cmp;
    });
  }
  let html='<div style="overflow:auto;flex:1">';
  html+=`<div style="margin-bottom:8px;font-size:14px;font-weight:600;color:var(--accent)">${escHtml(sheet.name)}</div>`;
  html+=`<button class="btn btn-sm mb-8" onclick="addSheetRow('${sheet.uid}')">＋新增行</button>`;
  html+=`<span style="font-size:12px;color:var(--text3);margin-left:8px">${sort&&sort.key?('排序：'+sort.key+' '+((sort.dir==='asc')?'▲':'▼')):''}</span>`;
  html+='<table class="grid-table"><thead><tr>';
  for(const col of cols){
    const arrow=(sort&&sort.key===col.key)?(sort.dir==='asc'?' ▲':' ▼'):'';
    html+=`<th onclick="toggleSheetSort('${sheet.uid}','${col.key}')" style="cursor:pointer;user-select:none" title="點擊排序">${escHtml(col.name)}${arrow}</th>`;
  }
  html+='<th style="width:60px">操作</th></tr></thead><tbody>';

  for(const {r,i} of indexed){
    html+='<tr>';
    for(const col of cols){
      const val=r[col.key]==null?'':r[col.key];
      html+=`<td><span class="editable" contenteditable="true" onblur="updateSheetCell('${sheet.uid}',${i},'${col.key}',this.innerText)">${escHtml(val)}</span></td>`;
    }
    html+=`<td><button class="btn btn-sm btn-danger" onclick="deleteSheetRow('${sheet.uid}',${i})">刪</button></td>`;
    html+='</tr>';
  }
  html+='</tbody></table></div>';
  el.innerHTML=html;
}

function clearTimeline(){

async function processTimelineAI(){
  const story=app.currentStory;if(!story)return;
  const chronicle=getSheet(story,'chronicle');
  if(!chronicle||chronicle.rows.length===0)return alert('尚無紀要條目');
  if(app.settings.aiProvider!=='ollama')return alert('此功能需使用 Ollama 模式（設定中切換）');

  // Build prompt with all chronicle entries
  let entries='';
  for(const r of chronicle.rows){
    entries+=`- [${r.code_index}] ${r.time_span||'?'} | ${r.location||'?'} | ${r.summary||r.chronicle?.slice(0,80)||'?'}\n`;
  }

  const prompt=`你是時間線分析專家。以下是故事紀要表中的所有事件條目：

${entries}

## 現有軌道
${story.timeline.tracks.map(t=>`- ${t.id}: ${t.name}`).join('\n')}

## 你的任務
1. 分析所有事件，將它們分配到適合的軌道上。主線放核心劇情，支線放次要/平行事件
2. 同一軌道內的事件按發生時間順序排列
3. 每個事件輸出：chronicle_code（紀要表的編碼索引）、track（軌道 id）、position（在軌道中的排序位置，從 0 開始）

## 輸出格式（純 JSON）
{
  "events":[
    {"chronicle_code":"1","track":"main","position":0},
    {"chronicle_code":"2","track":"main","position":1}
  ]
}`;

  // Ensure streaming panel is open
  if(!StreamState.el)toggleLivePanel();
  const outEl=StreamState.outEl;
  const statusEl=StreamState.statusEl;
  if(outEl)outEl.textContent='⏳ AI 時間線處理中...';
  if(statusEl)statusEl.innerHTML='📡 AI 正在分析事件並分配軌道...';
  story.timeline._prompt=prompt;
  const _tlStart=Date.now();

  try{
    let fullResponse='';
    // Start elapsed timer
    if(!StreamState._timer){
      StreamState._timer=setInterval(()=>{
        const se=StreamState.statusEl;
        if(!se)return;
        const elapsed=Date.now()-_tlStart;
        se.innerHTML='📡 AI 正在分析事件並分配軌道... ⏱ '+formatTime(elapsed);
      },1000);
    }
    await callOllamaStream(prompt,'時間線處理',(fullText,delta,done)=>{
      fullResponse=fullText;
      if(outEl)outEl.textContent=fullText;
      if(done){
        // Stop timer
        if(StreamState._timer){clearInterval(StreamState._timer);StreamState._timer=null}
        const dur=Date.now()-_tlStart;
        Metrics.add(prompt.length,fullText.length,dur,'timeline');
        try{
          const cleaned=extractJsonFromResponse(fullResponse);
          const parsed=JSON.parse(cleaned);
          if(!parsed.events||!Array.isArray(parsed.events))throw new Error('AI 回傳格式錯誤');
          // Clear existing timeline events and apply AI results
          for(const t of story.timeline.tracks)t.events=[];
          const gap=140;
          let ti=0;
          for(const ev of parsed.events){
            const chronicleRow=chronicle.rows.find(r=>r.code_index===String(ev.chronicle_code)||r.code_index===ev.chronicle_code);
            if(!chronicleRow)continue;
            const track=story.timeline.tracks.find(t=>t.id===ev.track);
            if(!track)continue;
            track.events.push({
              id:uid(),
              entryIndex:chronicle.rows.indexOf(chronicleRow),
              time:chronicleRow.time_span||'',
              label:chronicleRow.summary?.slice(0,40)||chronicleRow.code_index,
              code:chronicleRow.code_index,
              trackId:ev.track,
              x:0,y:0,
              _x:60+(ev.position!=null?ev.position:ti)*gap
            });
            ti++;
          }
          app.save();renderAll();
          if(statusEl)statusEl.innerHTML='✅ 時間線處理完成（'+formatTime(dur)+'）';
          if(outEl)outEl.textContent=JSON.stringify(parsed.events,null,2);
        }catch(e2){
          logAiError('時間線處理',prompt,fullResponse,e2.message);
          if(statusEl)statusEl.innerHTML='❌ 時間線處理失敗：'+e2.message;
        }
      }
    });
  }catch(e){
    logAiError('時間線處理',prompt,null,e.message);
    if(statusEl)statusEl.innerHTML='❌ 時間線處理失敗：'+e.message;
  }
}

// ---- Template editor state (module-scoped, no window leak) ----
const TmplEditState = (() => {
  let _state = null;
  return {
    get state(){ return _state; },
    set state(v){ _state = v; },
    render(){ if(_state) _state.renderEditor(); },
    clear(){ _state = null; },
  };
})();

function openTemplateEditor(tid){
  const tmpl=app.templates.find(t=>t.id===tid);
  if(!tmpl)return;
  let editing=clone(tmpl);

  const contentId='teContainer_'+uid();
  showModal('編輯模板：'+escHtml(tmpl.name),'<div id="'+contentId+'"></div>');

  TmplEditState.state={editing,tmpl,renderEditor:()=>{
    const e=TmplEditState.state;if(!e)return;
    const h=buildEditorHtml(e.editing,tmpl);
    const cont=document.getElementById(contentId);
    if(cont)cont.innerHTML=h;
  }};

  const tryRender=()=>{
    if(document.getElementById(contentId)){
      TmplEditState.render();
    }else{setTimeout(tryRender,30)}
  };
  tryRender();
}

function exportStoryHTML(){
  const story=app.currentStory;
  if(!story)return alert('請先選擇故事');
  const sheets=Object.values(story.sheets).filter(s=>s&&s.columns);

  // Build a sorted table for each sheet, using the same rules as the UI
  function buildSheetTable(sheet){
    const cols=sheet.columns.filter(c=>c.type!=='hidden');
    const sort=getSheetSort(sheet);
    const indexed=sheet.rows.map((r,i)=>({r,i}));
    if(sort&&sort.key){
      indexed.sort((a,b)=>{
        const av=(a.r[sort.key]==null?'':String(a.r[sort.key]));
        const bv=(b.r[sort.key]==null?'':String(b.r[sort.key]));
        let cmp=av.localeCompare(bv,'zh-Hant-CN');
        if(sort.dir==='desc')cmp=-cmp;
        return cmp;
      });
    }
    let t=`<h3>${escHtml(sheet.name)}</h3>`;
    if(!cols.length){t+='<p>（無欄位）</p>';return t}
    t+='<table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;width:100%">';
    t+='<thead><tr>';
    for(const col of cols){
      const arrow=(sort&&sort.key===col.key)?(sort.dir==='asc'?' ▲':' ▼'):'';
      t+=`<th style="background:#2d3040;color:#e0e0e0">${escHtml(col.name)}${arrow}</th>`;
    }
    t+='</tr></thead><tbody>';
    for(const {r} of indexed){
      t+='<tr>';
      for(const col of cols){
        t+=`<td>${escHtml(r[col.key]==null?'':r[col.key])}</td>`;
      }
      t+='</tr>';
    }
    t+='</tbody></table>';
    return t;
  }

  // Build tab bar + panels. Each sheet gets its own tab; "全部" shows all.
  let tabs='', panels='';
  const tabsHtml=(idx,name)=>
    `<button class="tab${idx===0?' active':''}" data-tab="${idx}" onclick="showTab(${idx})">${escHtml(name)}</button>`;
  tabs+=tabsHtml(0,'全部');
  panels+=`<div class="panel active" id="panel_all">\n${sheets.map(buildSheetTable).join('\n')}\n</div>`;
  sheets.forEach((sheet,i)=>{
    tabs+=tabsHtml(i+1,sheet.name);
    panels+=`<div class="panel" id="panel_${i+1}">\n${buildSheetTable(sheet)}\n</div>`;
  });

  const html=`<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>${escHtml(story.name)} - 故事紀要</title>
<style>
body{font-family:'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif;background:#0f1117;color:#e0e0e0;padding:24px;max-width:1200px;margin:0 auto}
h1{border-bottom:2px solid #6c8cff;padding-bottom:8px}
h3{color:#6c8cff;margin-top:24px}
th{font-weight:600;text-align:left}
td{vertical-align:top}
.tabbar{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 8px;position:sticky;top:0;background:#0f1117;padding:8px 0;z-index:10}
.tab{background:#1e2130;color:#c8c9d4;border:1px solid #33364a;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.tab:hover{border-color:#6c8cff}
.tab.active{background:#6c8cff;color:#fff;border-color:#6c8cff}
.panel{display:none}
.panel.active{display:block}
@media print{
  body{background:#fff;color:#000}
  th{background:#eee!important;color:#000!important}
  .tabbar{display:none}
  .panel{display:block!important}
}
</style>
</head>
<body>
<h1>${escHtml(story.name)}</h1>
<div class="tabbar">${tabs}</div>
${panels}
<script>
function showTab(n){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.tab)===n));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel_'+(n===0?'all':n)));
}
<\/script>
</body>
</html>`;
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=story.name+'_tables.html';a.click();
  URL.revokeObjectURL(a.href);
}

function importStory(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    const text=await file.text();
    try{
      const data=JSON.parse(text);
      if(!data.id||!data.name||!data.sheets)throw new Error('格式錯誤');
      data.id=uid();
      if(data._template){
        data._template.builtin=false;data._template.id=uid();
        app.templates.push(data._template);

    }catch(err){alert('匯入失敗：'+err.message)}

// ============ ONE-CLICK OLLAMA DEPLOY ============
async function deployOllama(){
  const status=document.getElementById('deployStatus');
  const btn=document.getElementById('deployBtn');
  if(!status||!btn)return;
  status.innerHTML='';btn.disabled=true;

  const log=(msg,type)=>{
    const c=type==='ok'?'var(--green)':type==='err'?'var(--red)':'var(--text2)';
    status.innerHTML+=`<div style="color:${c};font-size:13px;padding:2px 0">${msg}</div>`;
    status.scrollTop=status.scrollHeight;
  };

  // Step 0: Check if running from file://
  if(location.protocol==='file:'){
    log('⚠ 由 file:// 開啟 — 瀏覽器會擋掉 localhost 連線', 'err');
    log('解法 A：在同目錄開啟終端機，執行以下指令啟動伺服器：', '');
    log('  python -m http.server 8000', '');
    log('  然後開 http://localhost:8000/story_timeline_tool.html', '');
    log('解法 B：改用 Firefox 開啟此檔案（Firefox 允許 file:// fetch）', '');
    log('解法 C：設完後可手動在「設定」填入以下值：', '');
    log('  Ollama URL: http://localhost:11434/api/generate', '');
    log('  Ollama 模型: gemma4:12b', '');
    log('  並把 AI 模式切為「Ollama 本地」', '');
    btn.disabled=false;return;
  }

  // Step 1: Check Ollama connection
  log('正在檢查 Ollama 連線...');
  try{
    const resp=await fetch('http://localhost:11434/api/tags',{signal:AbortSignal.timeout(5000)});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    log('✓ Ollama 已連線。模型列表：'+(data.models||[]).map(m=>m.name).join(', ')||'(無模型)', 'ok');
  }catch(e){
    log('✗ 無法連線到 Ollama（http://localhost:11434）', 'err');
    log('請確認：', 'err');
    log('  1. 已安裝 Ollama：https://ollama.com/download', '');
    log('  2. Ollama 服務正在執行', '');
    log('  Windows 確認方式：在工作管理員查看 ollama.exe 是否存在', '');
    log('  或在終端機執行：ollama serve', '');
    btn.disabled=false;
    return;
  }

  // Step 2: Check if gemma4:12b already exists
  log('正在確認 gemma4:12b 模型狀態...');
  let alreadyHave=false;
  try{
    const resp=await fetch('http://localhost:11434/api/tags',{signal:AbortSignal.timeout(5000)});
    const data=await resp.json();
    alreadyHave=(data.models||[]).some(m=>m.name.startsWith('gemma4'));
    if(alreadyHave)log('✓ gemma4:12b 模型已存在', 'ok');
  }catch(e){}

  // Step 3: Pull model if needed
  if(!alreadyHave){
    log('正在下載 gemma4:12b（約 7.6GB，初次下載可能需要 5~30 分鐘）...');
    log('下載進度：');
    try{
      const resp=await fetch('http://localhost:11434/api/pull',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:'gemma4:12b',stream:true})
      });
      const reader=resp.body.getReader();
      const decoder=new TextDecoder();
      while(true){
        const {done,value}=await reader.read();
        if(done)break;
        const lines=decoder.decode(value).split('\n').filter(l=>l.trim());
        for(const line of lines){
          try{
            const j=JSON.parse(line);
            if(j.status)log('  '+j.status+(j.total?' ('+Math.round(j.completed/j.total*100)+'%)':''));
          }catch(e){}
        }
      }
      log('✓ gemma4:12b 下載完成！', 'ok');
    }catch(e){
      log('✗ 下載失敗：'+e.message, 'err');
      log('可手動在終端機執行：ollama pull gemma4:12b', '');
      btn.disabled=false;
      return;
    }
  }

  // Step 4: Apply settings
  app.settings.ollamaUrl='http://localhost:11434/api/generate';
  app.settings.ollamaModel='gemma4:12b';
  app.settings.aiProvider='ollama';
  app.save();
  log('✓ 設定已套用：AI 模式→Ollama，模型→gemma4:12b', 'ok');
  log('✅ 一鍵部署完成！現在可以關閉此視窗開始使用。', 'ok');
  btn.disabled=false;
  btn.textContent='✅ 已設定完成';
  const urlField=document.getElementById('setOllamaUrl');
  const modelField=document.getElementById('setOllamaModel');
  const modeField=document.getElementById('setAiMode');
  if(urlField)urlField.value='http://localhost:11434/api/generate';
  if(modelField)modelField.value='gemma4:12b';
  if(modeField)modeField.value='ollama';
}

window.testOpenAIConnection=async function(){
  const dot=document.getElementById('oiStatusDot');
  const msg=document.getElementById('oiStatusMsg');
  const sel=document.getElementById('setOpenaiModel');
  const urlInput=document.getElementById('setApiUrl');
  const keyInput=document.getElementById('setApiKey');
  if(!dot||!msg)return;
  const baseUrl=(urlInput?.value||'https://api.deepseek.com/v1').replace(/\/+$/,'');
  const apiKey=keyInput?.value||'';
  dot.textContent='🟡';msg.textContent='🟡 連線中...';msg.style.color='var(--accent)';
  try{
    const resp=await fetch(baseUrl+'/models',{
      headers:{'Authorization':'Bearer '+apiKey}
    });
    if(!resp.ok)throw new Error('HTTP '+resp.status+' '+(await resp.text()).slice(0,100));
    const data=await resp.json();
    const models=(data.data||[]).map(m=>m.id).sort();
    if(!models.length)throw new Error('伺服器未回傳任何模型');
    dot.textContent='🟢';msg.textContent='🟢 已連線 · '+models.length+' 個模型';msg.style.color='var(--green)';
    const current=app.settings.deepseekModel||'deepseek-chat';
    const pick=models.includes('deepseek-chat')?'deepseek-chat':(models.includes(current)?current:'');
    sel.innerHTML='<option value="">— 選擇模型 —</option>'+models.map(m=>`<option value="${escHtml(m)}"${m===pick?' selected':''}>${escHtml(m)}</option>`).join('');
    app.settings.openaiModels=models;
    app.save();
  }catch(e){
    dot.textContent='🔴';msg.textContent='🔴 連線失敗：'+e.message;msg.style.color='var(--red)';
  }
};

window.toggleAiModeFields=function(){
  const mode=document.getElementById('setAiMode')?.value;
  document.querySelectorAll('.show-if-deepseek').forEach(el=>el.classList.toggle('d-none',mode!=='deepseek'));
  document.querySelectorAll('.show-if-ollama').forEach(el=>el.classList.toggle('d-none',mode!=='ollama'));
};

function saveSettings(){
  const s=app.settings;
  s.tokenLimit=parseInt(document.getElementById('setToken')?.value)||2000;
  s.requestTimeout=(parseInt(document.getElementById('setTimeout')?.value)||180)*1000;
  s.maxRetries=parseInt(document.getElementById('setRetries')?.value)||0;
  s.retryDelay=(parseInt(document.getElementById('setRetryDelay')?.value)||5)*1000;
  s.aiProvider=document.getElementById('setAiMode')?.value||'prompt';
  s.apiKey=document.getElementById('setApiKey')?.value||'';
  s.apiEndpoint=document.getElementById('setApiUrl')?.value||'';
  s.deepseekModel=document.getElementById('setOpenaiModel')?.value||'deepseek-chat';
  s.thinkingEnabled=document.getElementById('setThinking')?.checked!==false;
  s.thinkingLevel=document.getElementById('setThinkingLevel')?.value||'medium';
  s.ollamaUrl=document.getElementById('setOllamaUrl')?.value||s.ollamaUrl;
  s.ollamaModel=document.getElementById('setOllamaModel')?.value||s.ollamaModel;
  app.save();closeModal();
}

// ============ LOCAL SERVER HELP ============
window.copyCmd=function(){
  navigator.clipboard.writeText('python -m http.server 8000').then(()=>{
    const h=document.getElementById('protocolHint');
    if(h)h.innerHTML='<span style="color:var(--green)">✓ 指令已複製！請在終端機貼上執行</span>';
  });
};
window.startLocalServer=function(){
  showModal('啟動本機伺服器',`
    <div style="font-size:13px">
      <p style="margin-bottom:8px">在終端機執行以下指令：</p>
      <pre style="background:var(--bg3);padding:12px;border-radius:6px;font-size:14px;user-select:all">python -m http.server 8000</pre>
      <p style="margin:8px 0">然後開啟：<a href="http://localhost:8000/story_timeline_tool.html" target="_blank" style="color:var(--accent)">http://localhost:8000/story_timeline_tool.html</a></p>
      <p style="color:var(--text3)">或直接雙擊目錄中的 <code>start_server.bat</code></p>
    </div>
    <div class="actions" style="margin-top:12px"><button class="btn" onclick="openNewTab()">🔄 切換到 localhost</button><button class="btn btn-outline" onclick="closeModal()">關閉</button></div>
  `);
};
window.openNewTab=function(){
  window.open('http://localhost:8000/story_timeline_tool.html','_blank');
  closeModal();
};

// ============ INIT ============
document.addEventListener('DOMContentLoaded',()=>{
  // Detect file:// protocol and show hint
  const hint=document.getElementById('protocolHint');
  if(hint&&location.protocol==='file:'){
    hint.style.display='inline';
    hint.innerHTML='<span style="color:var(--orange)">⚠ file:// 會擋 localhost。雙擊 </span><code style="background:var(--bg3);padding:1px 4px;border-radius:3px">start_server.bat</code><span style="color:var(--orange)"> 自動開瀏覽器（或 </span><a href="#" onclick="startLocalServer();return false" style="color:var(--accent)">看說明</a><span style="color:var(--orange)">）</span>';
  }
  renderAll();
});

// Auto-save on changes (debounced)
let _autoSaveTimer=null;
document.addEventListener('DOMContentLoaded',()=>{
  document.addEventListener('click',()=>{
    clearTimeout(_autoSaveTimer);
    _autoSaveTimer=setTimeout(()=>app.save(),500);
  });
});
</script>
</body>
