<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故事紀要自動總結工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Noto Sans TC','Microsoft JhengHei',sans-serif;background:#0f1117;color:#e0e0e0;height:100vh;overflow:hidden}
:root{--bg:#0f1117;--bg2:#1a1c24;--bg3:#23262e;--border:#2d3040;--accent:#6c8cff;--accent2:#ff6b6b;--text:#e0e0e0;--text2:#8890a0;--text3:#4a5260;--green:#4caf7d;--yellow:#ffc857;--red:#e06060}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
#app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.topbar .brand{font-weight:700;font-size:16px;color:var(--accent);margin-right:16px}
.topbar button,.topbar select{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:4px 12px;border-radius:4px;cursor:pointer;font-size:13px}
.topbar button:hover{background:var(--accent);color:#fff}
.topbar input{padding:4px 8px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:13px}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;padding:0 8px;overflow-x:auto}
.tab{padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;font-size:13px;color:var(--text2);white-space:nowrap}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.main{flex:1;overflow:hidden;position:relative}
.panel{display:none;height:100%;overflow:auto;padding:16px}
.panel.active{display:flex;flex-direction:column}
.grid-table{width:100%;border-collapse:collapse;font-size:13px}
.grid-table th{background:var(--bg3);color:var(--text2);padding:6px 8px;text-align:left;border:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
.grid-table td{padding:4px 8px;border:1px solid var(--border);vertical-align:top}
.grid-table tr:hover td{background:var(--bg3)}
.grid-table .editable:focus{outline:2px solid var(--accent);outline-offset:-1px;background:rgba(108,140,255,0.1)}
.doc-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.doc-item{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;display:flex;align-items:center;gap:8px}
.doc-item .name{flex:1;font-size:13px}
.doc-item .size{color:var(--text3);font-size:12px}
.doc-item .badge{font-size:11px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:3px}
.btn{background:var(--accent);border:none;color:#fff;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px}
.btn:hover{opacity:0.85}
.btn-sm{padding:3px 8px;font-size:12px}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--bg3)}
.btn-danger{background:var(--red)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow:auto}
.modal h3{margin-bottom:12px}
.modal textarea{width:100%;height:200px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:4px;resize:vertical;font-size:13px}
.modal .actions{display:flex;gap:8px;margin-top:12px}
.fr-match{background:#ffd54f;color:#222;border-radius:2px;padding:0 1px}
.fr-cur{background:#ff9800;color:#fff;padding:0 2px}
textarea.code{font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px}
.batch-list{display:flex;flex-direction:column;gap:6px}
.batch-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 14px}
.batch-card .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.batch-card .header .num{font-weight:600;color:var(--accent);font-size:13px}
.batch-card .header .tokens{color:var(--text3);font-size:12px}
.batch-card .preview{font-size:13px;color:var(--text2);line-height:1.5;max-height:60px;overflow:hidden;position:relative}
.batch-card .preview::after{content:'';position:absolute;bottom:0;left:0;right:0;height:20px;background:linear-gradient(transparent,var(--bg3))}
.batch-card .status{font-size:12px;padding:2px 8px;border-radius:3px;display:inline-block}
.status-pending{color:var(--text3)}
.status-done{color:var(--green)}
.status-processing{color:var(--yellow)}
.timeline-container{flex:1;overflow:auto;padding:20px}
.timeline-svg{width:100%;min-height:500px}
.timeline-svg .event-node{cursor:pointer}
.timeline-svg .event-node:hover .event-card{opacity:1}
.timeline-svg .event-card{opacity:0.8;transition:opacity 0.2s}
.timeline-svg text{font-size:12px;fill:var(--text2)}
.chat-area{display:flex;flex-direction:column;flex:1;height:100%}
.chat-messages{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.chat-msg{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;max-width:85%;font-size:13px;line-height:1.5}
.chat-msg.user{margin-left:auto;background:rgba(108,140,255,0.15);border-color:var(--accent)}
.chat-msg.ai{margin-right:auto}
.chat-msg .label{font-size:11px;color:var(--text3);margin-bottom:2px}
.chat-msg pre{background:var(--bg);padding:6px;border-radius:4px;margin:4px 0;font-size:12px;overflow-x:auto}
.chat-input{display:flex;gap:8px;padding:8px;background:var(--bg2);border-top:1px solid var(--border)}
.chat-input textarea{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:4px;resize:none;font-size:13px;min-height:36px;max-height:120px}
.chat-input textarea:focus{outline:none;border-color:var(--accent)}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.template-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:12px;cursor:pointer}
.template-card:hover{border-color:var(--accent)}
.template-card .name{font-weight:600;font-size:14px}
.template-card .desc{font-size:12px;color:var(--text2);margin-top:4px}
.flex{display:flex;gap:8px}
.flex-1{flex:1}
.gap-8{gap:8px}
.mt-8{margin-top:8px}
.mb-8{margin-bottom:8px}
.text-center{text-align:center}
.text-right{text-align:right}
.text-accent{color:var(--accent)}
.text-green{color:var(--green)}
.text-red{color:var(--red)}
.story-selector{display:flex;gap:8px;align-items:center}
.d-none{display:none}
</style>
</head>
<body>
<div id="app">
<div class="topbar">
  <span class="brand">📖 故事紀要工具</span>
  <div class="story-selector">
    <select id="storySelect" onchange="switchStory(this.value)"><option value="">— 選擇故事 —</option></select>
    <button onclick="newStory()">＋新故事</button>
    <button onclick="deleteCurrentStory()" style="background:var(--red);color:#fff" title="刪除當前故事">🗑刪除</button>
    <button onclick="importStory()">📂匯入</button>
    <button onclick="exportStory()">💾匯出</button>
    <button onclick="exportStoryHTML()" title="匯出全部表格為單一 HTML 檔案（保留排序）">📄匯出 HTML</button>
  </div>
  <span style="flex:1"></span>
  <span id="protocolHint" style="font-size:12px;display:none"></span>
  <span id="storyName" style="font-size:13px;color:var(--text2)"></span>
  <button onclick="showSettings()">⚙設定</button>
</div>
<div class="tabs" id="tabBar"></div>
<div class="main" id="mainArea"></div>
</div>
<script>
// ============ UUID ============
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

// ============ Jujutsu Kaisen Default Template ============
const JK_TEMPLATE = {
  id:'jk_default',name:'咒術迴戰模板',builtin:true,
  sheets:{
    chronicle:{
      uid:'sheet_chronicle',name:'紀要表',
      prompt:`# 紀要表填充規則
你必須從本次內容產出一條新條目。所有欄位值都必須是**單一字串**，重要對白多句時用換行符(\\n)串聯。

## 必填（從內容提取）
- time_span: 時間跨度 — 精確的時間範圍，如「2020年3月，傍晚」
- location: 地點 — 事件發生的具體位置
- chronicle: 紀要 — 200~450字，客觀按時間順序敘述事實，禁止結尾昇華、禁止評價
- summary: 概覽 — 50字以內，2~3句濃縮核心事件
- important_lines: 重要對白 — 單一字串，摘錄至少4句關鍵對話，標註說話者。多句以\\n串接。
- code_index: 編碼索引 — 自動編號，接續上一個編號+1

## 禁止
- 編造內容中不存在的事件或對白
- 使用陣列或多個獨立字串（全部合併為單一字串）
- 結尾加任何昇華、評價或感嘆
- 用 markdown 包裝 JSON（直接輸出純 JSON）

用繁體中文。`,
      columns:[
        {key:'row_id',name:'row_id',type:'hidden'},
        {key:'time_span',name:'時間跨度',type:'text'},
        {key:'location',name:'地點',type:'text'},
        {key:'chronicle',name:'紀要',type:'textarea',maxLen:450},
        {key:'summary',name:'概覽',type:'text',maxLen:100},
        {key:'important_lines',name:'重要對白',type:'textarea',maxLen:200},
        {key:'code_index',name:'編碼索引',type:'text'}
      ],
      rows:[]
    },
    character:{
      uid:'sheet_character',name:'重要角色表',
      prompt:`# 角色表填充規則
從本次內容提取**新登場**或**有新資訊**的角色。若無新角色則輸出空陣列[]。每個角色物件必須使用以下指定 key：

## 必填
- name: 姓名（必須填寫）
- occupation: 職業/身份 — 從內容提取，如「咒術高專學生」「咒術師」
- brief_intro: 人物簡介 — 角色定位與背景介紹（依內容篇幅而定）

## 選填（從內容可推斷就填，推斷不出則留空字串""）
- gender_age: 性別/年齡 — 如「男/約25歲」
- appearance: 外貌特徵 — 髮色、瞳色、穿著等
- current_status: 當前狀態 — 如「活躍」「負傷」
- is_absent: 是否離場 — 預設「否」，已明確死亡或離開才填「已死亡」
- power_level: 戰力等級 — 從選項中選：[四級|三級|二級|準一級|一級|特級|強特級|超特級|論外]
- unique_abilities: 獨特能力 — 角色特有的能力描述
- innate_technique: 生得術式 — 角色天生具備的術式
- bp_a: BPA — 數值，無法判斷就留空
- bp_b: BPB — 數值，無法判斷就留空
- relationships: 人際關係 — 與其他角色的關係
- alias: 別稱 — 綽號或稱號
- affection: 好感度 — 數值(-100~100)，無法判斷就留空
- trust: 信任度 — 數值(-100~100)，無法判斷就留空
- relationship_stage: 關係階段 — [陌生|認識|熟人|朋友|摯友|戀人|仇敵|宿敵]

## 鐵則
1. **只輸出具體有內容的字串，無法判斷的欄位留空字串""，不要編造**
2. **不要在 JSON 中使用 markdown 或額外文字**
3. **角色若已在「現有資料」列表中，請輸出該角色僅含需更新的欄位（姓名必須保留）**
4. **人物簡介(brief_intro)必須合併新舊資訊，不可直接覆蓋。將本次新增的資訊追加到既有簡介中，保留原有內容。**`,
      columns:[
        {key:'row_id',name:'row_id',type:'hidden'},
        {key:'name',name:'姓名',type:'text'},
        {key:'gender_age',name:'性別/年齡',type:'text'},
        {key:'appearance',name:'外貌特徵',type:'textarea'},
        {key:'current_status',name:'當前狀態',type:'text',maxLen:30},
        {key:'is_absent',name:'是否離場',type:'select',options:['否','是','已死亡']},
        {key:'occupation',name:'職業/身份',type:'text'},
        {key:'power_level',name:'戰力等級',type:'select',options:['四級','三級','二級','準一級','一級','特級','強特級','超特級','論外']},
        {key:'unique_abilities',name:'獨特能力',type:'textarea'},
        {key:'innate_technique',name:'生得術式',type:'text'},
        {key:'bp_a',name:'BPA(總肉體值)',type:'number'},
        {key:'bp_b',name:'BPB(術式強度)',type:'number'},
        {key:'relationships',name:'人際關係',type:'textarea'},
        {key:'brief_intro',name:'人物簡介',type:'textarea',maxLen:500},
        {key:'alias',name:'別稱',type:'text'},
        {key:'affection',name:'好感度',type:'number',min:-100,max:100},
        {key:'trust',name:'信任度',type:'number',min:-100,max:100},
        {key:'relationship_stage',name:'關係階段',type:'select',options:['陌生','認識','熟人','朋友','摯友','戀人','仇敵','宿敵']}
      ],
      rows:[]
    },
    faction:{
      uid:'sheet_faction',name:'勢力表',
      prompt:`# 勢力表填充規則
從本次內容提取**新登場**或**有新資訊**的勢力/組織。若無新勢力則輸出空陣列[]。

## 欄位
- faction_name: 名稱（**必填**）
- description: 描述 — 300字以內，勢力的目標、規模、特徵
- leader: 領袖 — 已知的首領姓名
- relationships: 關係 — 與其他勢力的關係，如「敵對」「同盟」「隸屬」
- location: 位置 — 勢力所在位置

## 鐵則
1. 只從內容中提取真實資訊，不要編造
2. 無法判斷的欄位留空字串""
3. 若勢力已在「已有勢力」列表中，請更新其欄位而非建立重複條目`,
      columns:[
        {key:'row_id',name:'row_id',type:'hidden'},
        {key:'faction_name',name:'名稱',type:'text'},
        {key:'description',name:'描述',type:'textarea',maxLen:300},
        {key:'leader',name:'領袖',type:'text'},
        {key:'relationships',name:'關係',type:'text'},
        {key:'location',name:'位置',type:'text'}
      ],
      rows:[]
    },
    item:{
      uid:'sheet_item',name:'重要物品表',
      prompt:`# 物品表填充規則
從本次內容提取**新登場**的重要物品/道具。若無新物品則輸出空陣列[]。

## 欄位
- item_name: 物品名稱（**必填**）
- quantity: 數量 — 數字，如 1
- description: 詳細描述 — 300字以內
- category: 類別 — 如「咒具」「武器」「飾品」
- remarks: 備註 — 任何補充說明
- brief_intro: 物品簡介 — 20字以內濃縮

## 鐵則
1. 只從內容提取，不要編造
2. 無法判斷的欄位留空字串""`,
      columns:[
        {key:'row_id',name:'row_id',type:'hidden'},
        {key:'item_name',name:'物品名稱',type:'text'},
        {key:'quantity',name:'數量',type:'number'},
        {key:'description',name:'詳細描述',type:'textarea',maxLen:300},
        {key:'category',name:'類別',type:'text'},
        {key:'remarks',name:'備註',type:'text'},
        {key:'brief_intro',name:'物品簡介',type:'text',maxLen:20}
      ],
      rows:[]
    },
    technique:{
      uid:'sheet_technique',name:'擴展術式表',
      prompt:`# 術式表填充規則
從本次內容提取**新登場**的術式/能力/技能。若無新術式則輸出空陣列[]。

## 欄位
- tech_name: 術式/能力名稱（**必填**）
- tech_type: 類別 — 從選項中選：[術式擴張|戰技|反轉術式|術式反轉|虛式|極之番]
- proficiency: 熟練度/階段 — 如「初學」「精通」「極限」
- effect_desc: 效果描述（**必填**） — 300字以內，說明術式的原理和效果
- brief_intro: 簡介 — 20字以內濃縮

## 鐵則
1. 只從內容提取，不要編造
2. 無法判斷的欄位留空字串""`,
      columns:[
        {key:'row_id',name:'row_id',type:'hidden'},
        {key:'tech_name',name:'術式/能力名稱',type:'text'},
        {key:'tech_type',name:'類別',type:'select',options:['術式擴張','戰技','反轉術式','術式反轉','虛式','極之番']},
        {key:'proficiency',name:'熟練度/階段',type:'text'},
        {key:'effect_desc',name:'效果描述',type:'textarea',maxLen:300},
        {key:'brief_intro',name:'簡介',type:'text',maxLen:20}
      ],
      rows:[]
    }
  }
};
const GEN_TEMPLATE = {
  id:'gen_default',name:'通用模板',builtin:true,

你必須從本次內容產出一條新條目。所有欄位值都必須是**單一字串**，重要對白多句時以換行符(\\n)串聯。

## 必填

- chronicle: 紀要 — 200~450字客觀敘述，禁止結尾昇華

      columns:[
        {key:'row_id',name:'row_id',type:'hidden'},

        {key:'location',name:'地點',type:'text'},
        {key:'chronicle',name:'紀要',type:'textarea',maxLen:450},

        {key:'row_id',name:'row_id',type:'hidden'},

const MAGIC_SCHOOL_TEMPLATE = {
  id:'magic_school',name:'魔法學園',builtin:true,
  sheets:{
    chronicle:{
      uid:'sheet_chronicle',name:'紀要表',
      prompt:'# 紀要表填充規則\n從本次內容產出一條新條目。所有欄位值都是**單一字串**，對白多句以換行符(\\n)串聯。用繁體中文。\n\n## 必填\n- time_span: 時間 — 如「2月1日，早上9:05」\n- location: 地點 — 如「訓練場」「教室」\n- chronicle: 紀要 — 150~400字客觀敘述\n- summary: 概覽 — 50字內濃縮\n- important_lines: 重要對白 — 標註說話者，多句以\\n串接\n- code_index: 編碼索引\n\n## 禁止：編造、markdown包裝、使用陣列',
      columns:[
        {key:'row_id',name:'row_id',type:'hidden'},
        {key:'time_span',name:'時間',type:'text'},
        {key:'location',name:'地點',type:'text'},

// ============ STORYSTORE MODULE ============
// Deep module: encapsulates all app state behind a small interface, with event-driven UI updates
const app = (()=>{
  // --- Private state ---
  let _stories=[];
  let _currentStoryId=null;
  let _settings={tokenLimit:2000, aiProvider:'prompt', apiKey:'', apiEndpoint:'', deepseekModel:'deepseek-chat', openaiModels:[], thinkingEnabled:true, thinkingLevel:'medium', ollamaUrl:'http://localhost:11434/api/generate', ollamaModel:'gemma4:12b', requestTimeout:180000, maxRetries:2, retryDelay:5000};
  let _templates=[JK_TEMPLATE,GEN_TEMPLATE,MAGIC_SCHOOL_TEMPLATE];
  const _tabOrder=['docs','chronicle','timeline','character','faction','item','magic','technique','foreshadow','chat','templates','errorlog'];
  const _tabLabels={'docs':'📂文檔','chronicle':'📋紀要表','timeline':'📈時間線','character':'👤角色','faction':'🏛勢力','item':'📦物品','magic':'✨魔法','technique':'⚡術式','foreshadow':'🔮伏筆','chat':'💬AI聊天','templates':'📐模板','errorlog':'⚠錯誤日誌'};
  let _saveTimer=null;

  // --- Event system ---
  const _listeners={};
  function on(ev,fn){
    (_listeners[ev]||(_listeners[ev]=[])).push(fn);
    return ()=>{const i=_listeners[ev]?.indexOf(fn);if(i>=0)_listeners[ev].splice(i,1)};
  }
  function emit(ev,...args){
    (_listeners[ev]||[]).forEach(fn=>fn(...args));
  }

  // --- Persistence ---
  // Transient batch fields: rebuildable or session-only, stripped when under storage pressure.
  const TRANSIENT_BATCH_FIELDS=['_streamLog','_prompt','_startTime','_streamStartTime','_attempts','_duration'];
  function stripBatchPayloads(stories,level){
    // level 1: remove recoverable batch text (rebuildable from doc.text via start/end).
    // level 2: also drop transient AI fields (_streamLog/_prompt/_startTime/...) EXCEPT on
    //          batches currently processing (their timing/log fields are live).
    // level 3: also drop the per-batch activity log and truncate errorLog.
    let stripped=0;
    for(const s of stories||[]){
      for(const d of s.doc||[]){
        for(const b of d.batches||[]){
          if(b.text&&b.start!=null){delete b.text;stripped++;}
          if(level>=2&&b.status!=='processing'){
            for(const k of TRANSIENT_BATCH_FIELDS){
              if(k in b){delete b[k];stripped++;}
            }
          }
          if(level>=3&&b._log){
            b._log=b._log.slice(-5);
            stripped++;
          }
        }
      }
      if(level>=3&&s.errorLog&&s.errorLog.length>10){
        s.errorLog=s.errorLog.slice(-10);
        for(const e of s.errorLog){
          if(e.fullRequest)e.fullRequest=e.fullRequest.slice(0,500);
          if(e.fullResponse)e.fullResponse=e.fullResponse.slice(0,500);
        }
        stripped++;
      }
    }
    return stripped;
  }
  function save(){
    clearTimeout(_saveTimer);
    // Tier 1: full save (only strips recoverable batch text).
    let stripped=stripBatchPayloads(_stories,1);
    let json;
    const payload=()=>JSON.stringify({
      stories:_stories, currentStoryId:_currentStoryId,
      templates:_templates, settings:_settings
    });
    try{
      json=payload();
      localStorage.setItem('storyApp',json);
      if(stripped>0)console.warn('已自動剝離 '+stripped+' 筆批次內容（由 doc.text 座標還原）');
    }catch(e){
      // Tier 2: drop transient AI fields (_streamLog/_prompt/etc) and retry.
      try{
        stripped=stripBatchPayloads(_stories,2);
        json=payload();
        localStorage.setItem('storyApp',json);
        console.warn('儲存空間吃緊：已移除臨時批次欄位（'+stripped+' 項）以完成儲存');
      }catch(e2){
        // Tier 3: drop activity logs and shrink errorLog, then retry.
        try{
          stripped=stripBatchPayloads(_stories,3);
          json=payload();
          localStorage.setItem('storyApp',json);
          console.warn('儲存空間吃緊：已移除處理紀錄與舊錯誤日誌（'+stripped+' 項）');
        }catch(e3){
          // Give up and surface a visible warning.
          try{
            console.warn('儲存失敗，可能 localStorage 已滿',e3.message);
            window._storageError='⚠ 儲存空間不足：最近的處理結果可能不會被保存。建議立即匯出故事備份（💾匯出），並刪除較舊的故事或文檔。';
          }catch(e4){}
        }
      }
    }
  }
  function load(){
    try{
      const d=localStorage.getItem('storyApp');
      if(!d)return;
      const p=JSON.parse(d);
      if(p.stories)_stories=p.stories;
      if(p.currentStoryId!=null)_currentStoryId=p.currentStoryId;
      // Merge: keep user custom templates, always use latest builtins
      if(p.templates){
        const userTemplates=p.templates.filter(t=>!t.builtin);
        _templates=[JK_TEMPLATE,GEN_TEMPLATE,MAGIC_SCHOOL_TEMPLATE,...userTemplates];
      }
      if(p.settings)_settings={..._settings,...p.settings};
    }catch(e){}
  }
  function debouncedSave(){clearTimeout(_saveTimer);_saveTimer=setTimeout(save,100)}

  // --- Load persisted data ---
  load();

  // --- Public API ---
  return {
    // Story access
    get stories(){return _stories},
    set stories(v){_stories=v;debouncedSave()},
    get currentStoryId(){return _currentStoryId},
    set currentStoryId(v){_currentStoryId=v;emit('currentStoryChanged',v);debouncedSave()},
    get currentStory(){
      if(!_currentStoryId)return null;
      return _stories.find(s=>s.id===_currentStoryId)||null;
    },
    getStory(id){return _stories.find(s=>s.id===id)},

    // Settings
    get settings(){return _settings},
    set settings(v){_settings=v;debouncedSave()},

    // Templates
    get templates(){return _templates},
    set templates(v){_templates=v;debouncedSave()},

    // UI config (immutable)
    get tabOrder(){return _tabOrder},
    get tabLabels(){return _tabLabels},

    // Events
    on, emit,

    // Persistence
    save,
    load,
  };
})();

// ============ HELPER ============
function clone(o){return JSON.parse(JSON.stringify(o))}
function countTokens(text){const c=text.match(/[\u4e00-\u9fff\uff00-\uffef]/g)||[];const w=text.match(/[a-zA-Z0-9]+/g)||[];return Math.ceil(c.length*1.5+w.length*1.3)}
function splitSentences(text){
  const re=/([^。！？\.!\?\n]+[。！？\.!\?\n]?)/g;
  const m=text.match(re);
  if(!m)return text.trim()?[text.trim()]:[];
  return m.map(s=>s.trim()).filter(s=>s.length>0);
}
function splitSentencesWithPos(text){
  const re=/([^。！？\.!\?\n]+[。！？\.!\?\n]?)/g;
  const out=[];
  let match;
  while((match=re.exec(text))!==null){
    const t=match[1].trim();
    if(t.length>0)out.push({text:t,start:match.index,end:match.index+match[1].length});
  }
  if(out.length===0&&text.trim())out.push({text:text.trim(),start:0,end:text.length});
  return out;
}
function formatDate(d){const dt=new Date(d);return dt.toISOString().slice(0,16).replace('T',' ')}
function nextCode(rows){const n=rows.length;return 'AM'+String(n+1).padStart(4,'0')}
function getSheet(story,sid){return story.sheets[sid]||null}
function getSheetByUid(story,uid){return Object.values(story.sheets).find(s=>s.uid===uid)}

// ============ DOCUMENT / BATCH ============
function importDocument(){
  const story=app.currentStory;
  if(!story)return alert('請先選擇或建立一個故事');
  const input=document.createElement('input');input.type='file';input.accept='.txt,.md,.json';
  input.onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    const name=file.name.replace(/\.(txt|md|json)$/,'')||('文檔'+(story.doc.length+1));
    const text=await file.text();
    if(!text.trim())return alert('檔案內容為空');
    addDocument(story,name,text);
  };
  input.click();
}

function splitTextToBatches(text){
  const tokenLimit=app.settings.tokenLimit;
  const sents=splitSentencesWithPos(text);
  const batches=[];
  let batch=null;
  for(const sent of sents){
    const t=countTokens(sent.text);
    if(t>tokenLimit){
      if(batch){batches.push(batch);batch=null}
      batches.push({id:uid(),text:sent.text,tokens:t,status:'pending',start:sent.start,end:sent.end});
      continue;
    }
    if(!batch){batch={id:uid(),text:sent.text,tokens:t,status:'pending',start:sent.start,end:sent.end}}
    else{
      const nt=batch.tokens+t;
      if(nt<=tokenLimit){batch.text+='\n'+sent.text;batch.tokens=nt;batch.end=sent.end}
      else{batches.push(batch);batch={id:uid(),text:sent.text,tokens:t,status:'pending',start:sent.start,end:sent.end}}
    }
  }
  if(batch)batches.push(batch);
  return batches;
}

function addDocument(story,name,text){
  const doc={id:uid(),name,text,imported:new Date().toISOString(),batches:[]};
  doc.batches=splitTextToBatches(text);
  story.doc.push(doc);
  app.save();renderAll();
}

function splitDocument(docIdx){
  const story=app.currentStory;if(!story)return;
  const doc=story.doc[docIdx];if(!doc)return;
  doc.batches=splitTextToBatches(doc.text);
}

// ============ BATCH RUNNER MODULE ============
// Encapsulates queue state; functions kept in-place but reference module
const BatchState = (() => {
  let q=[], c=false;
  return {
    enqueue(di,bi){ q.push({docIdx:di,batchIdx:bi}); },
    shift(){ return q.shift(); },
    reset(){ q=[]; c=false; },
    cancel(){ c=true; q=[]; },
    get cancelled(){ return c; },
    set cancelled(v){ c=v; },
    get length(){ return q.length; },
  };
})();

function enqueueBatch(docIdx,batchIdx){
  BatchState.enqueue(docIdx,batchIdx);
}

function processNextInQueue(){
  if(BatchState.cancelled||BatchState.length===0){
    if(BatchState.length===0&&!BatchState.cancelled){
      renderAll();
    }
    BatchState.reset();
    renderAll();
    return;
  }
  const item=BatchState.shift();
  _runBatchWithQueue(item.docIdx,item.batchIdx);
}

// ---- Batch activity log ----
// Records a timestamped, elapsed-time line on the batch so users can trace
// exactly what a batch did (start, first token, completion, retries, errors).
function batchLog(batch,action,detail){
  if(!batch)return;
  if(!batch._log)batch._log=[];
  const el=Date.now()-(batch._startTime||Date.now());
  batch._log.push({time:new Date().toISOString(),action,detail:(detail==null?'':detail),el});
  if(batch._log.length>100)batch._log=batch._log.slice(-100);
}

// Failure handling with automatic retry.
// Returns true when a retry has been scheduled (caller should NOT move the queue),
// false when attempts are exhausted — in that case the whole queue is stopped so
// remaining batches do NOT proceed until the user fixes the problem.
function batchGiveUp(docIdx,batchIdx,reason){
  const story=app.currentStory;if(!story)return false;
  const doc=story.doc[docIdx];if(!doc)return false;
  const batch=doc.batches[batchIdx];if(!batch)return false;
  batch._attempts=(batch._attempts||0)+1;
  batchLog(batch,'失敗',reason);
  logAiError('批次失敗（第 '+batch._attempts+' 次）',batch._prompt||'',null,reason);
  const max=app.settings.maxRetries||0;
  if(batch._attempts<=max){
    const delay=app.settings.retryDelay||5000;
    batchLog(batch,'重試','第 '+batch._attempts+'/'+max+' 次重試，'+(delay/1000)+'s 後重新呼叫 AI');
    batch.status='processing';
    app.save();
    setTimeout(()=>_runBatchWithQueue(docIdx,batchIdx),delay);
    return true;
  }
  // 重試次數用盡：停止整個佇列，不再繼續後續批次
  batch.status='pending';
  batchLog(batch,'已停止','重試 '+max+' 次後仍失敗，處理已中止');
  const remaining=BatchState.length;
  BatchState.cancel();
  app.save();renderAll();
  showModal('⚠ 批次處理已停止',`<div style="font-size:14px;color:var(--text)">批次 #${batchIdx+1} 在重試 ${max} 次後仍失敗，已停止處理，不再繼續後續批次。</div>
    <div style="font-size:13px;color:var(--text2);margin-top:6px;word-break:break-all">原因：${escHtml(reason)}</div>
    ${remaining?`<div style="font-size:13px;color:var(--orange);margin-top:6px">尚有 ${remaining} 個待處理批次已暫停。請修正問題後，再次點擊「▶ 處理所有待處理批次」繼續。</div>`:''}
    <div class="actions" style="margin-top:12px"><button class="btn" onclick="closeModal()">關閉</button></div>`);
  return false;
}

function showBatchLog(docIdx,batchIdx){
  const story=app.currentStory;if(!story)return;
  const doc=story.doc[docIdx];if(!doc)return;
  const batch=doc.batches[batchIdx];if(!batch)return;
  const logs=batch._log||[];
  let html='<div style="font-family:monospace;font-size:12px;max-height:60vh;overflow:auto">';
  if(!logs.length)html+='<div style="color:var(--text3)">尚無記錄</div>';
  for(const l of logs){
    const t=new Date(l.time);
    const hm=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0');
    html+=`<div style="padding:3px 0;border-bottom:1px solid var(--border);display:flex;gap:8px">
      <span style="color:var(--text3);white-space:nowrap">${hm}</span>
      <span style="color:var(--accent);white-space:nowrap">+${formatTime(l.el)}</span>
      <span style="color:var(--text2);white-space:nowrap">${escHtml(l.action)}</span>
      <span style="word-break:break-all">${escHtml(l.detail)}</span>
    </div>`;
  }
  html+='</div>';
  showModal('批次 #'+(batchIdx+1)+' 處理紀錄',html);
}


function stopBatchProcessing(){
  BatchState.cancel();
  // Reset any processing batches to pending
  const story=app.currentStory;
  if(story){
    for(const d of story.doc)
      for(const b of d.batches)
        if(b.status==='processing')b.status='pending';
  }
  app.save();renderAll();
}

function _runBatchWithQueue(docIdx,batchIdx){
  if(BatchState.cancelled){processNextInQueue();return}
  const story=app.currentStory;
  if(!story){processNextInQueue();return}
  const doc=story.doc[docIdx];if(!doc){processNextInQueue();return}
  const batch=doc.batches[batchIdx];if(!batch){processNextInQueue();return}
  // Recover batch text from doc if stripped (saves localStorage space)
  if(!batch.text&&batch.start!=null)batch.text=doc.text.slice(batch.start,batch.end);
  // Old batches may lack start/end; fall back to whole doc text as last resort
  if(!batch.text)batch.text=doc.text;
  batch.status='processing';renderAll();
  batch._startTime=Date.now();
  batch._streamStartTime=0;
  batchLog(batch,'開始處理','模式='+app.settings.aiProvider+(batch._attempts?'（第 '+(batch._attempts)+' 次嘗試）':''));

  const chronicle=getSheet(story,'chronicle');
  if(!chronicle){processNextInQueue();return}

  const prompt=applyThinkingMode(generateBatchPrompt(story,batch));
  batch._prompt=prompt;
  const mode=app.settings.aiProvider;

  const doneOne=()=>{
    if(!BatchState.cancelled)processNextInQueue();
    else processNextInQueue();
  };

  if(mode==='prompt'){
    navigator.clipboard.writeText(prompt).then(()=>{
      showModal('批次 Prompt（已複製到剪貼簿）',`<textarea class="code" style="height:300px" readonly>`+escHtml(prompt)+`</textarea>
      <p style="font-size:13px;color:var(--text2)">將以上 prompt 貼到 AI 後，把回覆貼回這裡：</p>
      <textarea id="aiResponse" style="height:150px" placeholder="貼入 AI 回覆..."></textarea>
      <div class="actions"><button class="btn" onclick="applyBatchResponse(${docIdx},${batchIdx})">套用回覆</button><button class="btn btn-outline" onclick="closeModal()">取消</button></div>`);
    }).catch(()=>{
      showModal('批次 Prompt','<textarea class="code" style="height:300px" readonly>'+escHtml(prompt)+'</textarea><div class="actions"><button class="btn" onclick="closeModal()">關閉</button></div>');
    });
  } else if(mode==='ollama'){
    // Only show panel if live stream is toggled on
    if(StreamState.el){
      showStreamPanel(docIdx,batchIdx,prompt);
    }
    // Start live timer immediately (even before first token) so a stuck/cold-start
    // request still shows elapsed time instead of "連線中..." forever
    if(!StreamState._timer){
      StreamState._lastOutput='';
      StreamState._timer=setInterval(()=>{
        const se=StreamState.statusEl;
        if(!se)return;
        const elapsed=Date.now()-(batch._startTime||Date.now());
        const streamElapsed=Date.now()-(batch._streamStartTime||Date.now());
        let text='⏱ '+formatTime(elapsed);
        if(batch._streamStartTime&&streamElapsed>2000){
          const curLen=(StreamState._lastOutput||'').length;
          if(curLen>10){
            const speed=curLen/(streamElapsed/1000);
            const ratio=Metrics.getAvgOutputRatio();
            const estimatedTotal=Math.max(curLen,(batch._prompt?.length||0)*ratio);
            const remain=(estimatedTotal-curLen)/speed;
            if(remain>0&&remain<3600)text+=' · 預計剩 '+formatTime(remain*1000);
          }
        }else if(!batch._streamStartTime){
          // Still waiting for first token — show a spinner-ish hint
          text+=' · 等待 AI 開始回應...';
        }
        if(se.innerHTML!==text)se.innerHTML=text;
      },1000);
    }
    callOllamaStream(prompt,'批次處理',(fullText,delta,done)=>{
      // Ensure panel tracks this batch (handles late panel open)
      if(StreamState.el&&(StreamState.docIdx!==docIdx||StreamState.batchIdx!==batchIdx)){
        StreamState.docIdx=docIdx;StreamState.batchIdx=batchIdx;
        if(delta&&StreamState.statusEl)StreamState.statusEl.innerHTML='📡 串流中...';
      }
      // Record stream start on first real token
      if(delta&&batch&&!batch._streamStartTime){
        batch._streamStartTime=Date.now();
        batchLog(batch,'收到首個 token','等待 '+formatTime(batch._streamStartTime-batch._startTime)+' 後開始回應');
      }
      const outEl=StreamState.outEl;
      const statusEl=StreamState.statusEl;
      if(outEl){
        if(outEl.textContent&&/^\s*⏳/.test(outEl.textContent)){
          outEl.textContent='';
          if(statusEl&&!statusEl.textContent.includes('📡'))statusEl.innerHTML='📡 串流中...';
        }
        outEl.textContent=fullText;
        outEl.scrollTop=outEl.scrollHeight;
      }
      StreamState._lastOutput=fullText;
      if(done){
        // Stop live timer
        if(StreamState._timer){clearInterval(StreamState._timer);StreamState._timer=null}
        // Record timing metrics
        const dur=Date.now()-(batch._startTime||Date.now());
        batch.duration=dur;
        if(fullText)Metrics.add(batch._prompt?.length||0,fullText.length,dur);
        app.save();
        if(statusEl)statusEl.textContent='✅ 完成';
        // Save stream log for later viewing
        if(batch&&fullText)batch._streamLog=fullText;
        batchLog(batch,'收到完整回覆','耗時 '+formatTime(dur)+'，輸出 '+fullText.length+' 字');
        let batchWillRetry=false;
        try{
          const cleaned=extractJsonFromResponse(fullText);
          const parsed=JSON.parse(cleaned);
          applyBatchResponseRaw(docIdx,batchIdx,parsed);
          batchLog(batch,'套用成功','JSON 已解析並寫入各表');
          if(statusEl)statusEl.innerHTML='✅ 處理完成（'+formatTime(dur)+'）';
        }catch(e2){
          logAiError('批次 JSON 解析',prompt,fullText,e2.message);
          batchLog(batch,'JSON 解析失敗',e2.message);
          batchWillRetry=batchGiveUp(docIdx,batchIdx,'JSON 解析失敗：'+e2.message);
          if(!batchWillRetry){
            batch.status='pending';renderAll();

          }
        }
        // Delay so user can see result before next batch overwrites panel
        if(!batchWillRetry)setTimeout(()=>doneOne(),2000);
      }
    }).catch(e=>{
      const outEl=StreamState.outEl;
      const statusEl=StreamState.statusEl;
      if(outEl)outEl.textContent='❌ 串流失敗 ('+e.message+')，改用非串流...';
      if(statusEl)statusEl.innerHTML='❌ 串流失敗，降級至非串流...';
      batchLog(batch,'串流失敗','降級為非串流：'+e.message);
      return callOllama(prompt,'批次處理').then(resp=>{
        let batchWillRetry=false;
        if(resp&&resp.response){
          if(outEl)outEl.textContent=resp.response;

          }catch(e2){
            batchLog(batch,'JSON 解析失敗',e2.message);
            batchWillRetry=batchGiveUp(docIdx,batchIdx,'JSON 解析失敗（非串流）：'+e2.message);
            if(!batchWillRetry){
              batch.status='pending';renderAll();
              if(statusEl)statusEl.innerHTML='❌ JSON 解析失敗（非串流）<br><button class="btn btn-sm" onclick="applyBatchResponse('+docIdx+','+batchIdx+')" style="margin-top:4px">套用為 JSON</button>';
            }

            batch.status='pending';renderAll();
            if(statusEl)statusEl.innerHTML='❌ 空回覆 — Ollama 未回傳內容';
          }
        }
        if(!batchWillRetry)setTimeout(()=>doneOne(),2000);
      }).catch(e=>{
        if(outEl)outEl.textContent='❌ 失敗：'+e.message;
        if(statusEl)statusEl.textContent='❌ 失敗';
        if(!batchGiveUp(docIdx,batchIdx,'Ollama 呼叫失敗：'+e.message)){
          batch.status='pending';renderAll();
          setTimeout(()=>doneOne(),2000);
        }
      });
    });

        let text='⏱ '+formatTime(elapsed);
        if(batch._streamStartTime&&streamElapsed>2000){
          const curLen=(StreamState._lastOutput||'').length;
          if(curLen>10){

            const ratio=Metrics.getAvgOutputRatio();

            const remain=(estimatedTotal-curLen)/speed;
            if(remain>0&&remain<3600)text+=' · 預計剩 '+formatTime(remain*1000);
          }
        }else if(!batch._streamStartTime){
          text+=' · 等待 AI 開始回應...';
        }
        if(se.innerHTML!==text)se.innerHTML=text;

    }
    callOpenAIStream(prompt,'批次處理',(fullText,delta,done)=>{

function processBatch(docIdx,batchIdx){
  const story=app.currentStory;if(!story)return;
  const doc=story.doc[docIdx];if(!doc)return;
  const batch=doc.batches[batchIdx];if(!batch)return;
  delete batch._attempts;
  BatchState.cancelled=false;
  enqueueBatch(docIdx,batchIdx);
  if(BatchState.length===1)processNextInQueue();
}

function generateBatchPrompt(story,batch){
  const tmpl=app.templates.find(t=>t.id===story.templateId);
  if(!tmpl)return batch.text;

  // Chronicle context (recent entries)
  const chronicle=getSheet(story,'chronicle');
  const recent=chronicle?chronicle.rows.slice(-20):[];
  let ctx='';
  for(const r of recent){
    ctx+=`- [${r.code_index||'?'}] ${r.time_span||'?'} | ${r.summary||r.chronicle?.slice(0,80)||'?'}\n`;
  }

  // Build per-sheet prompt sections (template-driven)
  let sheetSections='';
  const outputFields=[];
  for(const [key,sheet] of Object.entries(tmpl.sheets)){
    const data=getSheet(story,key);
    const existing=data?data.rows.length:0;
    const fields=sheet.columns.filter(c=>c.type!=='hidden'&&c.key!=='row_id');

    if(sheet.prompt){
      // Show existing entries for context
      sheetSections+=`\n---\n## ${sheet.name}（現有 ${existing} 筆）\n`;
      if(data&&data.rows.length>0){
        sheetSections+=`現有資料（請合併/更新，勿直接覆蓋）：\n`;
        for(const r of data.rows){
          sheetSections+=`- `;
          const parts=[];
          for(const f of fields){
            const val=r[f.key];
            if(val&&val.trim()){
              const v=val.length>100?val.slice(0,100)+'…':val;
              parts.push(`${f.key}=${v}`);
            }
          }
          sheetSections+=parts.join(' | ')+'\n';
        }
      }
      sheetSections+=`欄位：${fields.map(c=>c.name+'('+c.key+')').join(', ')}\n`;
      sheetSections+=`${sheet.prompt}\n`;
      // Merge instructions for key fields
      if(key==='character'){
        sheetSections+=`\n角色合併規則：若角色已存在，請**合併新資訊**到對應欄位。尤其人物簡介(brief_intro)必須保留既有內容並追加新資訊，不可直接覆蓋。其他欄位也優先保留既有值、僅補充本次新增的資訊。\n`;
      }
      sheetSections+=`輸出時物件必須使用上述**指定欄位key（括號內的英文key）**，不可使用其他key。若無新資料則輸出空陣列[]。\n`;
    }
    outputFields.push(key);
  }

  // Foreshadowing section — include existing so LLM doesn't duplicate
  const FORESHADOW_CRITERIA=`\n**伏筆判定標準（嚴格）：** 只有符合以下條件的事件才算是伏筆：
1. 對後續劇情造成**足夠深遠的影響**——會影響主線走向、重大轉折、角色命運、或揭開長期謎團。
2. 明顯是作者刻意埋下的線索（有具體細節、異常徵兆、未解釋的伏筆性台詞/物品/現象）。
3. 影響範圍**跨越多個場景或章節**，不是單場事件就結束的小細節。

**排除（不要提取）：**
- 當下就解釋清楚、立即解決的小事件
- 日常對話、瑣碎描述、臨時出現但無後續影響的人事物
- 角色的普通心情、短暫情緒、非關鍵的背景設定
- 過於模糊、無法判斷是否有後續影響的內容

寧可少提、不要濫提。若無符合標準的內容則輸出空陣列[]。`;
  let foreshadowSection=`\n## 伏筆\n`;
  if(story.foreshadow&&story.foreshadow.length>0){
    foreshadowSection+=`**已有伏筆（請勿重複提取）：**\n`;
    for(const f of story.foreshadow){
      foreshadowSection+=`- [${f.status}] ${f.text}（關鍵字：${f.keyword||'無'}）\n`;
    }
    foreshadowSection+=FORESHADOW_CRITERIA;
    foreshadowSection+=`\n請從本次內容中提取**新的**潛在伏筆（不可與以上重複），每筆包含 text（內容）和 keyword（關鍵字）。若無則輸出空陣列。`;
  }else{
    foreshadowSection+=FORESHADOW_CRITERIA;
    foreshadowSection+=`\n請從本次內容中提取潛在伏筆，每筆包含 text（內容）和 keyword（關鍵字）。若無則輸出空陣列。`;
  }
  sheetSections+=foreshadowSection;

  // Dynamic output format
  const formatParts=['"chronicle":{"time_span":"","location":"","chronicle":"","summary":"","important_lines":"","code_index":""}'];
  for(const key of outputFields){
    if(key==='chronicle')continue;
    formatParts.push(`"${key}":[]`);
  }
  formatParts.push('"foreshadowing":[]');
  const outputFmt='{\n  '+formatParts.join(',\n  ')+'\n}';

  const SPEAKER_RULE='\n## 對白歸屬規則\n- 內容中若出現「網名+冒號」前綴（如 (頭皮慶:) 或 (⋆.˚ ૮ • ﻌ - ა ˖ ࣪ ⊹ 老J:)），代表這是該玩家發言。\n- 玩家可能操控 NPC 角色，因此實際說話者不一定是該玩家本人，可能是其操控的 NPC。\n- 若該段內容中能明確找到實際說話的角色名稱，請**忽略前面的網名冒號**，將對白歸屬於內容中的角色。\n- 若找不到任何角色名，才將對白歸屬於前面的網名。\n';
  return `你是故事紀要工具。基於以下故事內容，依模板提示產出完整分析。${SPEAKER_RULE}

## 最近紀要條目（供參考）
${ctx||'（尚無條目）'}
${sheetSections}

## 本次批次內容
${batch.text}

## 輸出格式（純 JSON，無 markdown 包裝，無額外文字）
${outputFmt}`;
}

// Adjust prompt based on reasoning (thinking) settings:
// - thinkingEnabled off → ask for direct answer, no chain-of-thought
// - thinkingLevel low/medium/high → tune how much reasoning the model is asked to do
function applyThinkingMode(prompt){
  const s=app.settings;
  if(s.thinkingEnabled===false){
    return prompt+'\n\n請直接給出最終答案，不要輸出任何逐步推理、思考過程或「分析」章節。';
  }
  const level=s.thinkingLevel||'medium';
  const hints={
    low:'請先快速理解內容，再直接產出結果；推理保持簡短，不要展開多餘的思考步驟。',
    medium:'請先簡要分析內容的關鍵點，再產出結果。',
    high:'請先深入分析內容的所有細節與關聯（人物、事件、因果、伏筆），確認沒有遺漏後，再產出結果。'
  };
  return prompt+'\n\n'+(hints[level]||hints.medium);
}

// Strip markdown ```json ... ``` wrappers from LLM output, with JSON repair
function extractJsonFromResponse(text){
  if(!text)return text;
  let t=text.trim();
  // Remove markdown code block wrapper
  const md=t.match(/^\x60\x60\x60\s*(?:json|JSON)?\s*([\s\S]*?)\x60\x60\x60$/);
  if(md)t=md[1].trim();
  else t=t.replace(/^\x60\x60\x60\s*(?:json|JSON)?\s*/,'').replace(/\s*\x60\x60\x60$/,'');
  t=t.trim();
  if(!t)return t;

  // Try to parse; if it fails, attempt repair
  try{JSON.parse(t);return t}catch(e1){
    // Repair: fix "key": "val1", "val2", "val3" → "key": "val1\\nval2\\nval3"
    // This heals the common LLM mistake of outputting multiple unlabeled strings
    let fixed=t;
    for(let pass=0;pass<5;pass++){
      const before=fixed;
      // Repair 3+ consecutive bare strings: "s1", "s2", "s3"  → "s1\\ns2\\ns3"
      fixed=fixed.replace(/"([^"]*)",\s*"([^"]*)",\s*"([^"]*)"/g,'"$1\\n$2\\n$3"');
      // Repair 2 consecutive bare strings: "s1", "s2"  → "s1\\ns2"
      fixed=fixed.replace(/"([^"]*)",\s*"([^"]*)"\s*(?=[,}\]])/g,'"$1\\n$2"');
      if(fixed===before)break;
      try{JSON.parse(fixed);return fixed}catch(e2){}
    }
    return t; // Return original if all repairs fail
  }
}

function applyBatchResponse(docIdx,batchIdx){
  const ta=document.getElementById('aiResponse');
  if(!ta)return;
  try{
    const cleaned=extractJsonFromResponse(ta.value);
    const resp=JSON.parse(cleaned);
    applyBatchResponseRaw(docIdx,batchIdx,resp);
    closeModal();
  }catch(e){
    alert('JSON 解析失敗，請確認回覆是有效 JSON：'+e.message);
  }
}

function applyBatchResponseRaw(docIdx,batchIdx,resp){
  const story=app.currentStory;if(!story)return;
  const doc=story.doc[docIdx];if(!doc)return;
  const batch=doc.batches[batchIdx];if(!batch)return;
  const chronicle=getSheet(story,'chronicle');
  if(!chronicle)return;

  // --- 1. Process chronicle entry ---
  const chData=resp.chronicle||resp;
  const row={
    row_id:chronicle.rows.length+1,
    time_span:chData.time_span||'',
    location:chData.location||'',
    chronicle:chData.chronicle||'',
    summary:chData.summary||'',
    important_lines:chData.important_lines||'',
    code_index:chData.code_index||nextCode(chronicle.rows),
    _batchId:batch.id
  };
  chronicle.rows.push(row);

  // --- 2. Process all other sheets (template-driven) ---
  const tmpl=app.templates.find(t=>t.id===story.templateId);
  if(tmpl){
    for(const [key,sheet] of Object.entries(tmpl.sheets)){
      if(key==='chronicle')continue;
      const items=resp[key]||[];
      if(Array.isArray(items)&&items.length)upsertSheetItems(story,key,items);
    }
  }

  // --- 3. Process foreshadowing ---
  if(resp.foreshadowing&&Array.isArray(resp.foreshadowing)){
    for(const f of resp.foreshadowing){
      if(!f.text)continue;
      const exists=story.foreshadow.find(e=>e.text===f.text||(f.keyword&&e.keyword===f.keyword));
      if(!exists){
        story.foreshadow.push({
          id:uid(),text:f.text,keyword:f.keyword||'',
          status:'unresolved',created:formatDate(new Date()),resolvedIn:''
        });
      }
    }
  }

  // --- 4. Auto-detect foreshadowing resolution ---
  for(const f of story.foreshadow){
    if(f.status==='unresolved'){
      const combined=chData.chronicle+' '+chData.summary+' '+chData.important_lines;
      if(combined.includes(f.text.slice(0,10))||combined.includes(f.keyword||'')){
        f.status='resolved';f.resolvedIn=row.code_index;
      }
    }
  }

  // --- 5. Timeline is now post-processing (use AI button in timeline tab) ---

  batch.status='done';batch.result=row;
  delete batch._attempts;
  app.save();renderAll();
}

// Helper: upsert items into a sheet (characters/factions/items/techniques)
function upsertSheetItems(story,sheetKey,items){
  if(!items||!items.length)return;
  const sheet=getSheet(story,sheetKey);
  if(!sheet)return;

  // Map LLM output keys to template column keys
  // LLM often uses generic 'name'/'description' but template has specific keys
  function mapField(item,col){
    // Direct match first
    if(item[col.key]!=null)return item[col.key];
    // Map common LLM field names to template columns
    const name=col.key.toLowerCase();
    // Generic 'name' field → any column with 'name' in key (faction_name, item_name, tech_name, name)
    if((name==='faction_name'||name==='item_name'||name==='tech_name'||name==='name')&&item.name!=null)return item.name;
    // Generic 'description' → description/effect_desc/chronicle/brief_intro
    if((name==='description'||name==='effect_desc'||name==='chronicle'||name==='brief_intro')&&item.description!=null)return item.description;
    // 'effect_desc' → also try 'effect' 
    if(name==='effect_desc'&&item.effect!=null)return item.effect;
    // 'brief_intro' → try 'intro'
    if(name==='brief_intro'&&item.intro!=null)return item.intro;
    // 'leader' → try 'leader'
    // 'location' → try 'location'
    // 'category' → try 'category'  
    return '';
  }

  for(const item of items){
    // Build mapped version of item data
    const mapped={};
    for(const c of sheet.columns){
      mapped[c.key]=mapField(item,c);
    }

    // Dedup: check first visible text field
    const firstVisCol=sheet.columns.find(c=>c.type!=='hidden'&&c.key!=='row_id');
    const existing=firstVisCol?sheet.rows.find(r=>{
      const newVal=(mapped[firstVisCol.key]||'').toLowerCase();
      const oldVal=(r[firstVisCol.key]||'').toLowerCase();
      return newVal&&oldVal&&newVal===oldVal;
    }):null;

    if(existing){
      // Merge: update existing with non-empty new values
      for(const c of sheet.columns){
        if(c.type==='hidden'||c.key==='row_id')continue;
        if(mapped[c.key])existing[c.key]=mapped[c.key];
      }
    }else{
      const newRow={row_id:sheet.rows.length+1};
      for(const c of sheet.columns){
        if(c.key==='row_id')continue;
        newRow[c.key]=mapped[c.key];
      }
      sheet.rows.push(newRow);
    }
  }
}

function clearBatchResult(docIdx,batchIdx){
  const story=app.currentStory;if(!story)return;
  const doc=story.doc[docIdx];if(!doc)return;
  const batch=doc.batches[batchIdx];if(!batch)return;
  if(!confirm('清除此批次的處理結果？'))return;
  batch.status='pending';
  delete batch.result;
  // Remove the chronicle entry if exists
  const chronicle=getSheet(story,'chronicle');
  if(chronicle){
    const idx=chronicle.rows.findIndex(r=>r._batchId===batch.id);
    if(idx>=0)chronicle.rows.splice(idx,1);
  }
  app.save();renderAll();
}

function markBatchDone(docIdx,batchIdx){
  const story=app.currentStory;if(!story)return;
  const doc=story.doc[docIdx];if(!doc)return;
  const batch=doc.batches[batchIdx];if(!batch)return;
  if(!confirm('將此批次手動標記為「已處理」（不經過 AI）？'))return;
  batch.status='done';
  batch.duration=batch.duration||0;
  app.save();renderAll();
}

function deleteDocument(docIdx){
  const story=app.currentStory;if(!story)return;
  const doc=story.doc[docIdx];if(!doc)return;
  const doneCount=doc.batches.filter(b=>b.status==='done').length;
  let msg=`確認刪除文檔「${doc.name}」？\n此操作不可復原。`;
  if(doneCount>0)msg+=`\n\n將一併移除該文檔產生的 ${doneCount} 條紀要等表格條目。`;
  if(!confirm(msg))return;
  if(story.doc.some(d=>d.batches.some(b=>b.status==='processing'))){
    if(!confirm('目前有批次正在處理中，刪除可能導致異常。仍要刪除嗎？'))return;
  }
  const batchIds=new Set(doc.batches.map(b=>b.id));
  story.doc.splice(docIdx,1);
  for(const s of Object.values(story.sheets)){
    if(s.rows)s.rows=s.rows.filter(r=>!r._batchId||!batchIds.has(r._batchId));
  }
  app.save();renderAll();
}

function reprocessAllDone(){
  const story=app.currentStory;if(!story)return;
  if(!confirm('將所有已處理批次重設為待處理，可重新執行？'))return;
  for(const d of story.doc){
    for(const b of d.batches){
      if(b.status==='done'){
        b.status='pending';
        delete b.result;
      }
    }
  }
  // Remove all chronicle entries linked to batches
  const chronicle=getSheet(story,'chronicle');
  if(chronicle)chronicle.rows=[];
  app.save();renderAll();
}

function processAllBatches(){
  const story=app.currentStory;if(!story)return;
  let count=0;
  BatchState.reset();
  for(let di=0;di<story.doc.length;di++){
    for(let bi=0;bi<story.doc[di].batches.length;bi++){
      const b=story.doc[di].batches[bi];
      // Treat a batch with a result as done even if status is stale (defensive fix)
      if(b.result&&b.status!=='processing')b.status='done';
      if(b.status==='pending'){
        BatchState.enqueue(di,bi);
        count++;
      }
    }
  }
  if(count===0){alert('已無待處理批次');return}
  if(!confirm('將依序處理 '+count+' 個批次，確定開始？'))return;
  processNextInQueue();
}

// ============ AI CHAT ============
function sendChat(){
  const ta=document.getElementById('chatInput');
  if(!ta||!ta.value.trim())return;
  const msg=ta.value.trim();ta.value='';
  const story=app.currentStory;
  const box=document.getElementById('chatMessages');
  if(!box)return;
  box.insertAdjacentHTML('beforeend',`<div class="chat-msg user"><div class="label">你</div><div>${escHtml(msg)}</div></div>`);
  box.scrollTop=box.scrollHeight;

  const ctx=buildChatContext(story);
  const SPEAKER_RULE='\n## 對白歸屬規則\n- 內容中若出現「網名+冒號」前綴（如 (頭皮慶:) 或 (⋆.˚ ૮ • ﻌ - ა ˖ ࣪ ⊹ 老J:)），代表這是該玩家發言。\n- 玩家可能操控 NPC 角色，因此實際說話者不一定是該玩家本人，可能是其操控的 NPC。\n- 若該段內容中能明確找到實際說話的角色名稱，請**忽略前面的網名冒號**，將對白歸屬於內容中的角色。\n- 若找不到任何角色名，才將對白歸屬於前面的網名。\n';
  const fullPrompt=applyThinkingMode(`以下是當前故事表格資料：${SPEAKER_RULE}${ctx}\n\n使用者的訊息：${msg}\n\n請根據表格資料回答或執行使用者的要求。`);

  const mode=app.settings.aiProvider;
  if(mode==='prompt'){
    navigator.clipboard.writeText(fullPrompt).then(()=>{
      box.insertAdjacentHTML('beforeend',`<div class="chat-msg ai"><div class="label">AI (Prompt 已複製)</div><div>Prompt 已複製到剪貼簿。貼到你的 AI 工具後，把回覆貼回下方：</div>
        <textarea id="chatPaste" style="width:100%;height:60px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:4px;border-radius:4px;font-size:13px" placeholder="貼入 AI 回覆..."></textarea>
        <button class="btn btn-sm mt-8" onclick="applyChatPaste()">套用回覆</button></div>`);
      box.scrollTop=box.scrollHeight;
    }).catch(()=>{
      box.insertAdjacentHTML('beforeend',`<div class="chat-msg ai"><div class="label">AI</div><pre>${escHtml(fullPrompt)}</pre></div>`);
      box.scrollTop=box.scrollHeight;
    });
  } else if(mode==='ollama'){
    const msgId='chatMsg_'+uid();
    box.insertAdjacentHTML('beforeend',`<div class="chat-msg ai" id="${msgId}"><div class="label">AI</div><div class="chat-streaming" style="color:var(--text3)">⏳ 生成中...</div></div>`);
    box.scrollTop=box.scrollHeight;
    const msgEl=document.querySelector('#'+msgId+' div:last-child');
    callOllamaStream(fullPrompt,'AI 對話',(fullText,delta,done)=>{
      if(msgEl){
        msgEl.textContent=fullText;
        msgEl.style.color='var(--text)';
        msgEl.classList.remove('chat-streaming');
        box.scrollTop=box.scrollHeight;
      }
      if(done){
        tryProcessChatAction(fullText);
      }
    }).catch(e=>{
      if(msgEl)msgEl.innerHTML='<span style="color:var(--red)">錯誤：'+escHtml(e.message)+'</span>';
      box.scrollTop=box.scrollHeight;
    });
  } else if(mode==='deepseek'){
    const msgId='chatMsg_'+uid();
    box.insertAdjacentHTML('beforeend',`<div class="chat-msg ai" id="${msgId}"><div class="label">AI</div><div class="chat-streaming" style="color:var(--text3)">⏳ 生成中...</div></div>`);
    box.scrollTop=box.scrollHeight;
    const msgEl=document.querySelector('#'+msgId+' div:last-child');
    callOpenAIStream(fullPrompt,'AI 對話',(fullText,delta,done)=>{
      if(msgEl){
        msgEl.textContent=fullText;
        msgEl.style.color='var(--text)';
        msgEl.classList.remove('chat-streaming');
        box.scrollTop=box.scrollHeight;
      }
      if(done){
        tryProcessChatAction(fullText);
      }
    }).catch(e=>{
      if(msgEl)msgEl.innerHTML='<span style="color:var(--red)">錯誤：'+escHtml(e.message)+'</span>';
      box.scrollTop=box.scrollHeight;
    });
  }
}

function applyChatPaste(){
  const ta=document.getElementById('chatPaste');if(!ta)return;
  const box=document.getElementById('chatMessages');if(!box)return;
  const text=ta.value;
  box.insertAdjacentHTML('beforeend',`<div class="chat-msg ai"><div class="label">AI 回覆</div><div>${escHtml(text)}</div></div>`);
  ta.remove();box.scrollTop=box.scrollHeight;
  tryProcessChatAction(text);
}

function tryProcessChatAction(text){
  try{
    const json=typeof text==='string'?JSON.parse(text):text;
    if(json.action){
      if(json.action==='update_row'&&json.sheet&&json.row&&json.data){
        const story=app.currentStory;if(!story)return;
        const sheet=getSheet(story,json.sheet);
        if(sheet&&sheet.rows[json.row-1]){
          Object.assign(sheet.rows[json.row-1],json.data);
          app.save();renderAll();
        }
      }
      if(json.action==='add_row'&&json.sheet&&json.data){
        const story=app.currentStory;if(!story)return;
        const sheet=getSheet(story,json.sheet);
        if(sheet){
          json.data.row_id=sheet.rows.length+1;
          sheet.rows.push(json.data);
          app.save();renderAll();
        }
      }
      if(json.action==='resolve_foreshadow'&&json.id){
        const story=app.currentStory;if(!story)return;
        const f=story.foreshadow.find(f=>f.id===json.id);
        if(f){f.status='resolved';f.resolvedIn=json.batch||'chat';app.save();renderAll()}
      }
    }
  }catch(e){}
}

function buildChatContext(story){
  if(!story)return'（無故事）';
  let s='';
  for(const [k,v] of Object.entries(story.sheets)){
    s+=`\n=== ${v.name} ===\n`;
    if(v.rows.length===0){s+='（無資料）\n';continue}
    const headers=v.columns.filter(c=>c.type!=='hidden').map(c=>c.name).join(' | ');
    s+=headers+'\n';
    for(const r of v.rows){
      s+=v.columns.filter(c=>c.type!=='hidden').map(c=>r[c.key]||'').join(' | ')+'\n';
    }
  }
  if(story.foreshadow.length){
    s+=`\n=== 伏筆追蹤 ===\n`;
    for(const f of story.foreshadow){
      s+=`- ${f.text} [${f.status}]${f.status==='resolved'?' 解決於: '+f.resolvedIn:''}\n`;
    }
  }
  return s;
}

// ============ AI ERROR LOG ============
function logAiError(context,request,response,error){
  const story=app.currentStory;
  if(!story)return;
  if(!story.errorLog)story.errorLog=[];
  const reqStr=request==null?'':typeof request==='string'?request:JSON.stringify(request);
  const respStr=response==null?'':typeof response==='string'?response:JSON.stringify(response);
  story.errorLog.push({
    id:uid(),time:new Date().toISOString(),context,
    requestPreview:reqStr.slice(0,2000),
    responsePreview:respStr.slice(0,2000)||'(空回覆)',
    error:error||'',
    fullRequest:reqStr.slice(0,8000),
    fullResponse:respStr.slice(0,8000)
  });
  if(story.errorLog.length>100)story.errorLog=story.errorLog.slice(-100);
  app.save();
}

function renderErrorLogPanel(el){
  const story=app.currentStory;
  if(!story){el.innerHTML='';return}
  const logs=story.errorLog||[];
  let html=`<div style="margin-bottom:8px;display:flex;gap:8px;align-items:center">
    <span style="font-size:14px;font-weight:600;color:var(--red)">⚠ AI 錯誤日誌</span>
    <span style="font-size:13px;color:var(--text2)">共 ${logs.length} 筆</span>
    ${logs.length?`<button class="btn btn-sm btn-danger" onclick="clearErrorLog()">清空日誌</button>`:''}
  </div>`;
  if(logs.length===0){
    html+='<div style="padding:20px;text-align:center;color:var(--text3)">尚無錯誤記錄</div>';
    el.innerHTML=html;return;
  }
  for(let i=logs.length-1;i>=0;i--){
    const log=logs[i];
    html+=`<div style="background:var(--bg3);border:1px solid var(--red);border-radius:6px;padding:8px 12px;margin-bottom:6px">`;
    html+=`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text3)">`;
    html+=`<span>${escHtml(log.time)}</span><span>${escHtml(log.context)}</span></div>`;
    if(log.error){
      html+=`<div style="color:var(--red);font-size:13px;margin-top:4px">✗ ${escHtml(log.error)}</div>`;
      if(log.error.includes('Failed to fetch')||log.error.includes('fetch'))
        html+=`<div style="color:var(--orange);font-size:12px;margin-top:2px">💡 無法連線到 Ollama。請確認：<br>• Ollama 服務正在執行（<code style="background:var(--bg);padding:0 3px;border-radius:2px">ollama serve</code>）<br>• Ollama URL 設定正確（設定 → Ollama URL）</div>`;
      else if(log.error.includes('HTTP'))
        html+=`<div style="color:var(--orange);font-size:12px;margin-top:2px">💡 Ollama 回傳非預期狀態碼，請確認 API URL 和模型名稱正確</div>`;
      else if(log.error.includes('空回覆'))
        html+=`<div style="color:var(--orange);font-size:12px;margin-top:2px">💡 AI 回傳空內容，可能需要簡化批次內容或更換模型</div>`;
    }
    if(log.responsePreview)html+=`<div style="margin-top:4px;font-size:12px;color:var(--text2)"><strong>回覆：</strong>${escHtml(log.responsePreview)}</div>`;
    html+=`<details style="margin-top:4px"><summary style="font-size:12px;color:var(--accent);cursor:pointer">查看完整內容</summary>`;
    if(log.fullRequest)html+=`<pre style="background:var(--bg);padding:6px;border-radius:4px;margin-top:4px;font-size:11px;max-height:150px;overflow:auto">${escHtml(log.fullRequest.slice(0,2000))}</pre>`;
    if(log.fullResponse)html+=`<pre style="background:var(--bg);padding:6px;border-radius:4px;margin-top:4px;font-size:11px;max-height:150px;overflow:auto">${escHtml(log.fullResponse.slice(0,2000))}</pre>`;
    html+=`</details></div>`;
  }
  el.innerHTML=html;
}

function clearErrorLog(){
  const story=app.currentStory;
  if(!story||!confirm('確認清空錯誤日誌？'))return;
  story.errorLog=[];
  app.save();renderAll();
}

async function callOllama(prompt,context){
  const url=app.settings.ollamaUrl;
  const model=app.settings.ollamaModel;
  const timeout=app.settings.requestTimeout||180000;
  try{
    const resp=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model, prompt, stream:false}),
      signal:AbortSignal.timeout(timeout)
    });
    if(!resp.ok)throw new Error('Ollama HTTP '+resp.status);
    const data=await resp.json();
    if(!data||!data.response){
      const errMsg='空回覆或格式異常';
      logAiError(context||'Ollama 呼叫',prompt,data,errMsg);
      throw new Error(errMsg+'：'+JSON.stringify(data).slice(0,200));
    }
    return data;
  }catch(e){
    logAiError(context||'Ollama 呼叫',prompt,null,e.message);
    throw e;
  }
}

async function callOllamaStream(prompt,context,onToken){
  const url=app.settings.ollamaUrl;
  const model=app.settings.ollamaModel;
  let fullText='';
  let rawBuf='';
  const timeout=app.settings.requestTimeout||180000;
  try{
    const resp=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model, prompt, stream:true}),
      signal:AbortSignal.timeout(timeout)
    });
    if(!resp.ok)throw new Error('Ollama HTTP '+resp.status);

    // Fallback: if ReadableStream not available, read as text
    if(!resp.body||!resp.body.getReader){
      const text=await resp.text();
      rawBuf=text;
      // Try to extract response via simple regex or parse as non-streaming JSON
      try{
        const data=JSON.parse(text);
        if(data.response)fullText=data.response;
      }catch(e){fullText=text}
      if(fullText)onToken(fullText,'',true);
      else throw new Error('無法解析串流回覆');
      return fullText;
    }

    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buf='';
    let _tokLast=0; // last token display time for throttling
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=decoder.decode(value,{stream:true});
      rawBuf=buf;
      const lines=buf.split('\n');
      buf=lines.pop()||'';
      for(const line of lines){
        const trimmed=line.trim();
        if(!trimmed)continue;
        try{
          const chunk=JSON.parse(trimmed);
          if(chunk.response!=null){
            fullText+=chunk.response;
            onToken(fullText,chunk.response,chunk.done||false);
            // Throttle to ~30ms between token displays so browser has time to paint
            const _now=Date.now();
            const _elapsed=_now-_tokLast;
            if(_elapsed<30&&_tokLast>0){
              await new Promise(r=>setTimeout(r,30-_elapsed));
            }
            _tokLast=Date.now();
          }else if(chunk.error){
            throw new Error('Ollama 錯誤：'+chunk.error);
          }
          if(chunk.done){
            if(chunk.done_reason==='load')throw new Error('模型載入中（冷啟動）');
            break;
          }
        }catch(e){
          if(e.message.startsWith('Ollama 錯誤')||e.message.includes('載入'))throw e;
          // Malformed line — ignore, stream continues
        }
      }
    }
    if(buf.trim()){
      try{
        const chunk=JSON.parse(buf.trim());
        if(chunk.response!=null){
          fullText+=chunk.response;
          onToken(fullText,chunk.response,true);
        }
      }catch(e){}
    }
    if(!fullText){
      // If we got something in raw buffer but couldn't parse, send it raw
      if(rawBuf.trim()){
        fullText=rawBuf.trim();
        onToken(fullText,'',true);
      }else{
        logAiError(context||'Ollama 串流',prompt,null,'串流結束但無內容');
        throw new Error('串流結束但無內容');
      }
    }
    return fullText;
  }catch(e){
    logAiError(context||'Ollama 串流',prompt,null,e.message);
    throw e;
  }
}

async function callOpenAI(prompt,context){

  const url=base+'/chat/completions';
  const model=app.settings.deepseekModel||'deepseek-chat';
  const key=app.settings.apiKey;
  const timeout=app.settings.requestTimeout||180000;
  try{
    const resp=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model,messages:[{role:'user',content:prompt}],stream:false}),
      signal:AbortSignal.timeout(timeout)
    });
    if(!resp.ok)throw new Error('OpenAI HTTP '+resp.status);
    const data=await resp.json();

async function callOpenAIStream(prompt,context,onToken){
  const base=(app.settings.apiEndpoint||'https://api.deepseek.com/v1').replace(/\/+$/,'');
  const url=base+'/chat/completions';
  const model=app.settings.deepseekModel||'deepseek-chat';
  const key=app.settings.apiKey;
  let fullText='';
  const timeout=app.settings.requestTimeout||180000;
  try{
    const resp=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model,messages:[{role:'user',content:prompt}],stream:true}),
      signal:AbortSignal.timeout(timeout)
    });
    if(!resp.ok)throw new Error('OpenAI HTTP '+resp.status);
    if(!resp.body||!resp.body.getReader){
      const data=await resp.json();
      const text=data.choices?.[0]?.message?.content||'';
      if(text)onToken(text,'',true);
      else throw new Error('無法解析回覆');
      return text;
    }
    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buf='';
    let _tokLast=0;
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        const payload=line.slice(6).trim();
        if(payload==='[DONE]')continue;
        try{
          const chunk=JSON.parse(payload);
          const delta=chunk.choices?.[0]?.delta?.content||'';
          if(!delta)continue;
          fullText+=delta;
          const now=Date.now();
          if(now-_tokLast>=30){_tokLast=now;onToken(fullText,delta,false)}
        }catch(e){}
      }
    }
    if(fullText){
      onToken(fullText,'',true);
    }else{
      logAiError(context||'OpenAI 串流',prompt,null,'串流結束但無內容');
      throw new Error('串流結束但無內容');
    }
    return fullText;
  }catch(e){
    logAiError(context||'OpenAI 串流',prompt,null,e.message);
    throw e;
  }
}

function formatTime(ms){
  if(ms<1000)return '<1s';
  const sec=Math.round(ms/1000);
  if(sec<120)return sec+'s';
  const min=Math.floor(sec/60);
  const s=sec%60;
  return min+'m'+s+'s';
}

// Metrics: records batch/timeline performance for ETA estimation
const Metrics = (()=>{
  let records=[];
  return {
    add(inputChars,outputChars,durationMs,type='batch'){
      records.push({inputChars,outputChars,durationMs,type,time:Date.now()});
    },
    getAvgOutputRatio(){
      const rs=records.filter(r=>r.type==='batch'&&r.inputChars>0);
      if(!rs.length)return 0.15;
      return rs.reduce((s,r)=>s+r.outputChars/r.inputChars,0)/rs.length;
    },
    getAvgCharSpeed(){
      const rs=records.filter(r=>r.type==='batch'&&r.durationMs>0);
      if(!rs.length)return 20;
      const totalChars=rs.reduce((s,r)=>s+r.outputChars,0);
      const totalMs=rs.reduce((s,r)=>s+r.durationMs,0);
      return totalChars/(totalMs/1000);
    },
    estimateRemaining(inputChars,currentOutputChars,elapsedMs){
      if(currentOutputChars<10)return null;
      const ratio=this.getAvgOutputRatio();
      const estimatedTotal=Math.max(currentOutputChars,inputChars*ratio);
      const speed=currentOutputChars/(Math.max(elapsedMs,500)/1000);
      const remainS=(estimatedTotal-currentOutputChars)/speed;
      return remainS>0&&remainS<7200?Math.round(remainS):null;
    }
  };
})();

    get el(){return st.el}, set el(v){st.el=v},

    get batchIdx(){return st.batchIdx}, set batchIdx(v){st.batchIdx=v},
    get panelId(){return st.panelId}, set panelId(v){st.panelId=v},
    get statusId(){return st.statusId}, set statusId(v){st.statusId=v},
    get outEl(){return st.outEl}, set outEl(v){st.outEl=v},
    get statusEl(){return st.statusEl}, set statusEl(v){st.statusEl=v},
    get _timer(){return st._timer}, set _timer(v){st._timer=v},
    get _lastOutput(){return st._lastOutput}, set _lastOutput(v){st._lastOutput=v},
    nextId(){return ++st.id},
    reset(){
      if(st._timer){clearInterval(st._timer);st._timer=null}

    if(StreamState.docIdx>=0&&StreamState.batchIdx>=0){
      const story=app.currentStory;
